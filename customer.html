<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Redirecting to My Garage…</title>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var allowed = ['id', 'bookingId', 'booking', 'phone', 'paid', 'subscribed', 'sub_cancel', 'canceled', 'subscribe'];
  var out = new URLSearchParams();
  allowed.forEach(function (key) {
    var val = params.get(key);
    if (val) {
      if (key === 'id' || key === 'booking') out.set('bookingId', val);
      else out.set(key, val);
    }
  });
  var dest = 'my-garage.html';
  var qs = out.toString();
  if (qs) dest += '?' + qs;
  if (!qs && location.hash) dest += location.hash;
  else if (location.hash && !dest.includes('#')) dest += location.hash;
  location.replace(dest);
})();
</script>
</head>
<body>
<p>Redirecting to <a href="my-garage.html">My Garage</a>…</p>
</body>
</html>
