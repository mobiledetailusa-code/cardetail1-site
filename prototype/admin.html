<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0f16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex,nofollow">
<title>Cardetail1 — Admin Day View (Prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
</head>
<body class="proto-mobile-frame">
<div class="proto-shell">
<div class="proto-banner">⚠ PROTOTYPE — Admin Day View · mock data only · <a href="index.html" style="color:#fcd34d">← Hub</a></div>

<header class="hdr">
  <div class="hdr-brand">
    <div class="hdr-title">Cardetail<span style="color:var(--ac)">1</span></div>
    <div class="hdr-sub">Admin Ops · Day View</div>
  </div>
  <div class="hdr-actions">
    <button type="button" class="icon-btn" title="Notifications" aria-label="Notifications">🔔</button>
    <button type="button" class="icon-btn ac" title="Calendar" aria-label="Calendar">📅</button>
  </div>
</header>

<nav class="nav-pills">
  <button type="button" class="pill on" data-view="day">Day View</button>
  <a href="../admin-ops.html" class="pill" title="Production admin (existing)">Jobs Board →</a>
  <button type="button" class="pill outline-red" id="btn-signout">Sign Out</button>
</nav>

<main class="main">
  <div class="sec-title">Your Schedule</div>
  <div class="cal-strip" id="cal-strip" role="tablist" aria-label="Week calendar"></div>
  <div class="cal-banner" id="cal-banner"></div>

  <div id="hero-job"></div>
  <div id="map-wrap"></div>

  <div class="sec-title">Today's Schedule</div>
  <div class="sched-list" id="sched-list"></div>

  <div class="sec-title">Upcoming (next 7 days)</div>
  <div id="upcoming"></div>
</main>

<!-- Job management drawer — mirrors admin-ops functions -->
<div class="drawer-bg" id="drawer-bg">
  <aside class="drawer" id="job-drawer">
    <div class="dh">
      <div>
        <h2 id="drawer-title">Manage Appointment</h2>
        <div class="mono" id="drawer-id" style="font-size:11px;color:var(--mu);margin-top:4px"></div>
      </div>
      <button type="button" class="close" data-close-drawer aria-label="Close">×</button>
    </div>
    <div class="db" id="drawer-body"></div>
    <div class="ds" id="drawer-actions"></div>
  </aside>
</div>

<script src="mock-data.js"></script>
<script src="calendar.js"></script>
<script src="ui.js"></script>
<script src="admin.js"></script>
</div>
</body>
</html>
