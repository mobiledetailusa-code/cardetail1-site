name: Integration protection

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NODE_VERSION: '22'
  DATABASE_URL: postgresql://cardetail1_ci:cardetail1_ci@127.0.0.1:5432/cardetail1_ci?schema=public
  POSTGRES_PAYMENT_AUTHORITY: 'true'
  TWILIO_OUTBOX_ENABLED: 'false'
  TWILIO_ENABLED: 'false'
  TWILIO_PRODUCTION_SENDS_ENABLED: 'false'
  CUSTOMER_TRANSACTIONAL_SMS_ENABLED: 'false'
  ADMIN_SMS_CONSENT_GRANTED: 'false'
  STRIPE_SECRET_KEY: ''
  STRIPE_WEBHOOK_SECRET: ''
  TWILIO_ACCOUNT_SID: ''
  TWILIO_API_KEY: ''
  TWILIO_API_SECRET: ''
  TWILIO_AUTH_TOKEN: ''
  TWILIO_MESSAGING_SERVICE_SID: ''
  TWILIO_WORKER_SECRET: ''

jobs:
  migrations:
    name: integration / migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cardetail1_ci
          POSTGRES_PASSWORD: cardetail1_ci
          POSTGRES_DB: cardetail1_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cardetail1_ci -d cardetail1_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js from lockfile cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply every migration from zero
        run: npx --no-install prisma migrate deploy
      - name: Audit migration status
        run: npx --no-install prisma migrate status
      - name: Reject schema drift after migrations
        run: npx --no-install prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

  full_test:
    name: integration / full-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cardetail1_ci
          POSTGRES_PASSWORD: cardetail1_ci
          POSTGRES_DB: cardetail1_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cardetail1_ci -d cardetail1_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Use Node.js from lockfile cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply database migrations
        run: npx --no-install prisma migrate deploy
      - name: Prepare legacy performance-artifact path
        run: mkdir -p 'C:/Projects/Cardetail1/artifacts/temp'
      - name: Create isolated Square settlement database
        env:
          SQUARE_SETTLEMENT_TEST_PASSWORD: cardetail1_ci
        run: |
          node <<'NODE'
          'use strict';
          const { Client } = require('pg');
          const HOST = '127.0.0.1';
          const PORT = 5432;
          const SETTLEMENT_DATABASE = 'cardetail1_square_settlement_7d';
          const COMMERCIAL_DATABASE = 'cardetail1_ci';
          const USER = 'cardetail1_ci';
          const password = process.env.SQUARE_SETTLEMENT_TEST_PASSWORD || '';
          function refuse(message) {
            console.error(message);
            process.exit(1);
          }
          if (!/^[A-Za-z0-9_]+$/.test(password)) refuse('settlement ci password refused');
          const commercialUrl = process.env.DATABASE_URL || '';
          let commercial;
          try {
            commercial = new URL(commercialUrl);
          } catch {
            refuse('commercial ci database target refused');
          }
          const commercialName = decodeURIComponent(commercial.pathname.replace(/^\//, '').split('?')[0]);
          if (commercial.hostname !== HOST || String(commercial.port) !== String(PORT) || commercialName !== COMMERCIAL_DATABASE) {
            refuse('commercial ci database target refused');
          }
          if (/neon|amazonaws|supabase|squareup/i.test(commercialUrl)) refuse('remote database target refused');
          async function connect(database) {
            const client = new Client({
              host: HOST,
              port: PORT,
              user: USER,
              password,
              database,
              connectionTimeoutMillis: 5000,
            });
            await client.connect();
            return client;
          }
          (async () => {
            const admin = await connect('postgres');
            try {
              const proof = await admin.query('SELECT inet_server_port()::text AS port');
              if (proof.rows[0].port !== String(PORT)) refuse('settlement ci port refused');
              const existing = await admin.query(
                'SELECT datname FROM pg_database WHERE datname = ANY($1::text[])',
                [[COMMERCIAL_DATABASE, SETTLEMENT_DATABASE]]
              );
              const names = new Set(existing.rows.map((row) => row.datname));
              if (!names.has(COMMERCIAL_DATABASE)) refuse('commercial ci database missing');
              if (!names.has(SETTLEMENT_DATABASE)) {
                await admin.query(`CREATE DATABASE "${SETTLEMENT_DATABASE}" OWNER "${USER}"`);
              }
            } finally {
              await admin.end();
            }
            const settlement = await connect(SETTLEMENT_DATABASE);
            try {
              const identity = await settlement.query(
                `SELECT current_database() AS database,
                        inet_server_port()::text AS port,
                        to_regclass('public."PaymentAttempt"') AS commercial_attempt,
                        (SELECT count(*)::int FROM information_schema.tables WHERE table_schema = 'public') AS public_tables`
              );
              const row = identity.rows[0];
              if (row.database !== SETTLEMENT_DATABASE || row.port !== String(PORT)) {
                refuse('settlement ci database identity refused');
              }
              if (row.commercial_attempt || row.public_tables !== 0) {
                refuse('settlement ci database is not an empty dedicated database');
              }
              console.log('prepared empty settlement database on 127.0.0.1 port 5432');
            } finally {
              await settlement.end();
            }
          })().catch((error) => {
            const message = String(error && error.message || '');
            console.error(message.includes(password) ? 'settlement ci database preparation failed' : (message || 'settlement ci database preparation failed'));
            process.exit(1);
          });
          NODE
      - name: Run repository tests
        run: |
          set -euo pipefail
          mapfile -t files < <(find tests -maxdepth 1 -type f -name '*.test.js' ! -name 'square-sandbox-settlement.test.js' ! -name 'square-verified-reconciliation.test.js' | sort)
          test "${#files[@]}" -gt 0
          node --test "${files[@]}"
      - name: Run Square settlement tests on the service loopback
        env:
          SQUARE_SETTLEMENT_TEST_PORT: '5432'
          SQUARE_SETTLEMENT_TEST_PASSWORD: cardetail1_ci
        run: |
          set -euo pipefail
          mapfile -t ids < <(docker ps -q --filter ancestor=postgres:16-alpine)
          if [ "${#ids[@]}" -ne 1 ]; then
            echo "expected one ephemeral postgres service"
            exit 1
          fi
          pid="$(docker inspect -f '{{.State.Pid}}' "${ids[0]}")"
          test -n "$pid"
          command -v nsenter >/dev/null
          sudo --preserve-env=PATH,SQUARE_SETTLEMENT_TEST_PORT,SQUARE_SETTLEMENT_TEST_PASSWORD \
            nsenter -t "$pid" -n -- \
            bash -c 'cd "$1" && node --test tests/square-sandbox-settlement.test.js && node --test tests/square-verified-reconciliation.test.js' bash "$PWD"

  financial_invariants:
    name: integration / financial-invariants
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cardetail1_ci
          POSTGRES_PASSWORD: cardetail1_ci
          POSTGRES_DB: cardetail1_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cardetail1_ci -d cardetail1_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js from lockfile cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply database migrations
        run: npx --no-install prisma migrate deploy
      - name: Run financial invariant contract
        run: >-
          node --test
          tests/payment-authority-service.test.js
          tests/cash-postgres-authority.test.js
          tests/addon-financial-mutation.test.js
          tests/package-financial-mutation.test.js
          tests/admin-payment-operations.test.js
          tests/refund-adjustment-receipts-pr2.test.js
          tests/payment-financial-parity.test.js

  portal_parity:
    name: integration / portal-parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cardetail1_ci
          POSTGRES_PASSWORD: cardetail1_ci
          POSTGRES_DB: cardetail1_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cardetail1_ci -d cardetail1_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js from lockfile cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply database migrations
        run: npx --no-install prisma migrate deploy
      - name: Run Admin and Customer parity contract
        run: >-
          node --test
          tests/portal-synchronization-pr3.test.js
          tests/customer-admin-operations-pr4.test.js
          tests/portal-admin-customer-e2e.test.js
          tests/checkout-parity.test.js
          tests/customer-receipt-functional.test.js
          tests/customer-receipt-security.test.js

  netlify_build:
    name: integration / netlify-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONTEXT: deploy-preview
      BRANCH: ${{ github.head_ref || github.ref_name }}
      DEPLOY_URL: https://deploy-preview-ci.invalid
      DEPLOY_PRIME_URL: https://deploy-preview-ci.invalid
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js from lockfile cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .github/netlify-build/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install locked Netlify build tool
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix .github/netlify-build
      - name: Build Netlify preview without project credentials
        run: .github/netlify-build/node_modules/.bin/netlify build --offline --context deploy-preview
      - name: Verify the Square Sandbox receiver stays out of the commercial bundle
        run: node sandbox/square-webhook/scripts/verify-build-isolation.mjs --main-dist .netlify/functions
      - name: Assert preview cannot enable Twilio provider
        run: >-
          node -e "const assert=require('node:assert/strict');
          const {outboundTwilioPolicy}=require('./netlify/lib/twilio-runtime-policy');
          const result=outboundTwilioPolicy({...process.env,
          CONTEXT:'deploy-preview',TWILIO_OUTBOX_ENABLED:'true',TWILIO_ENABLED:'true',
          TWILIO_PRODUCTION_SENDS_ENABLED:'true',TWILIO_ACCOUNT_SID:'AC0000000000',
          TWILIO_API_KEY:'SK0000000000',TWILIO_API_SECRET:'ci-only-inert',
          TWILIO_MESSAGING_SERVICE_SID:'MG0000000000',
          TWILIO_STATUS_CALLBACK_URL:'https://ci.invalid/status'});
          assert.equal(result.ok,false);assert.equal(result.reason,'non_production_context');"

  stripe_test_mode:
    name: integration / stripe-test-mode
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cardetail1_ci
          POSTGRES_PASSWORD: cardetail1_ci
          POSTGRES_DB: cardetail1_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cardetail1_ci -d cardetail1_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CONTEXT: dev
      CD1_FORCE_LOCAL_STRIPE_GUARD: '1'
      POSTGRES_PAYMENT_AUTHORITY: 'true'
      TWILIO_OUTBOX_ENABLED: 'false'
      TWILIO_ENABLED: 'false'
      TWILIO_PRODUCTION_SENDS_ENABLED: 'false'
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js from lockfile cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply database migrations
        run: npx --no-install prisma migrate deploy
      - name: Prove the Stripe test-mode balance
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: node scripts/isolated-balance-proof.js
