# Netlify configuration — Cardetail1
# Deploy: arraste a pasta do projeto em https://app.netlify.com/drop
# ou conecte este repositório Git no painel da Netlify.

[build]
  # Site estático: nada para "buildar", só publicar a raiz.
  publish = "."
  functions = "netlify/functions"

# A página principal é o index.html (servido nativamente na raiz "/").

# Portais com URLs limpas (estilo nationaldetailpros).
[[redirects]]
  from = "/customer"
  to = "/customer.html"
  status = 200
[[redirects]]
  from = "/technician"
  to = "/technician.html"
  status = 200
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
[[redirects]]
  from = "/terms-conditions"
  to = "/terms-conditions.html"
  status = 200

# Headers de segurança básicos.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=(self)"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.stripe.com https://*.stripe.com https://*.stripe.network; frame-src https://js.stripe.com https://hooks.stripe.com https://*.stripe.com; form-action 'self'; upgrade-insecure-requests"
