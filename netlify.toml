# Legacy Search Console paths. Each rule ends on the HTTPS apex canonical.
# Host-specific rules are listed first so a www or http request can finish in
# one hop when Netlify evaluates them before the automatic domain redirect.
# `to` has no query string, so the original parameters are kept.
# /app/cms, /submit-inquiry, and /'+mailto+' stay 404 on purpose.
[[redirects]]
  from = "http://www.cardetail1.com/personal-watercraft-packages"
  to = "https://cardetail1.com/boats-detailing"
