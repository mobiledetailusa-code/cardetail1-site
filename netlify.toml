# Netlify configuration — Cardetail1
# Deploy: arraste a pasta do projeto em https://app.netlify.com/drop
# ou conecte este repositório Git no painel da Netlify.

[build]
  # Bake deploy CONTEXT/BRANCH/DEPLOY_URL for Functions (not injected at runtime here).
  command = "node scripts/generate-deploy-runtime-env.js"
  publish = "."
  functions = "netlify/functions"

# Public Twilio webhook URLs are not credentials, but Netlify treats any env var
# marked "Contains secret values" as a scan target. Omit those keys so example
# files and tests can mention the Production paths without failing the deploy.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "TWILIO_VOICE_WEBHOOK_URL,TWILIO_INBOUND_WEBHOOK_URL,TWILIO_STATUS_CALLBACK_URL"

[functions]
  # Ensure Blobs is available to all Functions (Garage Plan / RevOps store helpers).
  # twilio resolves sub-modules dynamically and does not survive esbuild bundling;
  # it must be installed as a real node_module or the functions that reach it fail
  # to load at cold start and return a non-JSON 500.
  # The Prisma driver adapter and pg carry native/dynamic resolution and need the
  # same treatment for the Owner Studio catalog functions.
  external_node_modules = ["@netlify/blobs", "twilio", "@prisma/adapter-pg", "pg", "@prisma/client"]

# Production outbox drain. In-code exports.config was not registered on this
# site's Netlify functions bundle (schedule remained null). Pin it here too.
[functions."twilio-outbox-worker"]
  schedule = "*/2 * * * *"

[dev]
  port = 8888
  publish = "."
  functions = "netlify/functions"

# A página principal é o index.html (servido nativamente na raiz "/").

# Portais com URLs limpas (estilo nationaldetailpros).
[[redirects]]
  from = "/customer"
  to = "/customer.html"
  status = 200
[[redirects]]
  from = "/my-garage"
  to = "/my-garage.html"
  status = 200
[[redirects]]
  from = "/appointment-access"
  to = "/.netlify/functions/customer-appointment-access"
  status = 200
[[redirects]]
  from = "/a"
  to = "/.netlify/functions/customer-appointment-access"
  status = 200
  force = true
[[redirects]]
  from = "/technician"
  to = "/technician.html"
  status = 200
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
[[redirects]]
  from = "/admin/owner-studio"
  to = "/admin-owner-studio.html"
  status = 200
[[redirects]]
  from = "/admin/owner-studio/catalog"
  to = "/admin-owner-studio-catalog.html"
  status = 200
[[redirects]]
  from = "/admin-ops"
  to = "/admin-ops.html"
  status = 200
[[redirects]]
  from = "/admin-owner-studio"
  to = "/admin-owner-studio.html"
  status = 200
[[redirects]]
  from = "/admin-owner-studio-catalog"
  to = "/admin-owner-studio-catalog.html"
  status = 200
[[redirects]]
  from = "/terms-conditions"
  to = "/terms-conditions.html"
  status = 200
[[redirects]]
  from = "/resume"
  to = "/resume.html"
  status = 200

[[headers]]
  for = "/customer.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
[[headers]]
  for = "/admin-ops.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
[[headers]]
  for = "/technician.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
[[headers]]
  for = "/admin.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
[[headers]]
  for = "/admin-owner-studio.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

# Headers de segurança básicos.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # frame-src must include 'self' so specialty pages can embed the homepage booking modal.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com https://www.googletagmanager.com https://www.google-analytics.com https://www.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.stripe.com https://*.netlify.app https://www.google-analytics.com https://www.clarity.ms blob:; frame-src 'self' https://js.stripe.com https://hooks.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self'"

# Access-token URLs must not leak ?t= via Referer into the garage or third parties.
[[headers]]
  for = "/a"
  [headers.values]
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

# WELCOME10 QA — branch deploy for operations-core-job-lifecycle only (not production).
[context."operations-core-job-lifecycle".environment]
  FIRST_BOOKING_OFFER_ENABLED = "true"
  FIRST_BOOKING_OFFER_PERCENT = "10"
  FIRST_BOOKING_OFFER_CAP_CENTS = "4000"
  FIRST_BOOKING_OFFER_TRIGGER_SECONDS = "120"
  FIRST_BOOKING_OFFER_STACKING = "false"
