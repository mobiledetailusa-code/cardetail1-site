# Public HTML duplicates. Extensionless is the canonical URL already served
# at 200 (and trailing slashes already 301 there). force is required because
# the .html file exists. There is no reverse rewrite back to .html: that pair
# loops when Netlify Pretty URLs also rewrites the extensionless path.
# Query strings (book, multi, utm_*, gclid, gbraid, wbraid) are preserved.
# Operational portals are omitted so their existing 200 rewrites cannot loop.
[[redirects]]
