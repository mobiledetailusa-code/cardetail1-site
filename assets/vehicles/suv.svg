<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 110" fill="none" role="img" aria-label="SUV">
  <!-- body — taller, more upright than sedan -->
  <path d="M10,80 L14,56 L30,38 L55,18 L90,10 L200,10 L228,18 L248,38 L258,58 L262,80 Z" fill="rgba(5,14,32,.88)" stroke="#4da3ff" stroke-width="2" stroke-linejoin="round"/>
  <!-- glass area — tall upright windows -->
  <path d="M60,18 L70,8 L202,8 L220,18 L214,42 L62,42 Z" fill="rgba(77,163,255,.09)" stroke="#4da3ff" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- B pillar -->
  <line x1="130" y1="8" x2="128" y2="42" stroke="#4da3ff" stroke-width="1.5" opacity=".5"/>
  <!-- C pillar -->
  <line x1="180" y1="8" x2="178" y2="42" stroke="#4da3ff" stroke-width="1.2" opacity=".4"/>
  <!-- front pillar -->
  <line x1="60" y1="18" x2="68" y2="42" stroke="#4da3ff" stroke-width="1" opacity=".4"/>
  <!-- roof rack line -->
  <line x1="70" y1="7" x2="200" y2="7" stroke="#4da3ff" stroke-width="1.2" opacity=".35"/>
  <!-- front wheel -->
  <circle cx="72" cy="80" r="21" fill="rgba(3,9,22,.95)" stroke="#4da3ff" stroke-width="2"/>
  <circle cx="72" cy="80" r="10" fill="none" stroke="#4da3ff" stroke-width="1.3"/>
  <line x1="61" y1="80" x2="83" y2="80" stroke="#4da3ff" stroke-width="1" opacity=".5"/>
  <line x1="72" y1="69" x2="72" y2="91" stroke="#4da3ff" stroke-width="1" opacity=".5"/>
  <circle cx="72" cy="80" r="3.5" fill="#4da3ff" opacity=".6"/>
  <!-- rear wheel -->
  <circle cx="204" cy="80" r="21" fill="rgba(3,9,22,.95)" stroke="#4da3ff" stroke-width="2"/>
  <circle cx="204" cy="80" r="10" fill="none" stroke="#4da3ff" stroke-width="1.3"/>
  <line x1="193" y1="80" x2="215" y2="80" stroke="#4da3ff" stroke-width="1" opacity=".5"/>
  <line x1="204" y1="69" x2="204" y2="91" stroke="#4da3ff" stroke-width="1" opacity=".5"/>
  <circle cx="204" cy="80" r="3.5" fill="#4da3ff" opacity=".6"/>
  <!-- headlight -->
  <ellipse cx="255" cy="55" rx="5" ry="9" fill="rgba(77,163,255,.35)" stroke="#4da3ff" stroke-width="1.2"/>
  <!-- taillight -->
  <rect x="10" y="52" width="5" height="18" rx="2" fill="rgba(77,163,255,.25)" stroke="#4da3ff" stroke-width="1"/>
  <!-- ground line -->
  <line x1="28" y1="100" x2="254" y2="100" stroke="#4da3ff" stroke-width="1" opacity=".18"/>
</svg>
