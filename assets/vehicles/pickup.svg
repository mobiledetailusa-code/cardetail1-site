<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 110" fill="none" role="img" aria-label="Pickup Truck">
  <!-- cab section -->
  <path d="M10,80 L14,54 L32,34 L70,14 L130,10 L150,10 L158,14 L162,34 L162,80 Z" fill="rgba(5,14,32,.88)" stroke="#4da3ff" stroke-width="2" stroke-linejoin="round"/>
  <!-- cab glass -->
  <path d="M74,14 L82,8 L148,8 L156,14 L152,38 L76,38 Z" fill="rgba(77,163,255,.09)" stroke="#4da3ff" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- B pillar -->
  <line x1="120" y1="8" x2="118" y2="38" stroke="#4da3ff" stroke-width="1.5" opacity=".5"/>
  <!-- bed section -->
  <path d="M162,46 L162,80 L272,80 L280,74 L280,46 Z" fill="rgba(5,14,32,.7)" stroke="#4da3ff" stroke-width="2" stroke-linejoin="round"/>
  <!-- bed side detail -->
  <line x1="162" y1="52" x2="280" y2="52" stroke="#4da3ff" stroke-width="1" opacity=".35"/>
  <line x1="200" y1="52" x2="200" y2="80" stroke="#4da3ff" stroke-width="1" opacity=".25"/>
  <!-- bed rails -->
  <rect x="162" y="44" width="118" height="6" rx="1" fill="rgba(77,163,255,.15)" stroke="#4da3ff" stroke-width="1"/>
  <!-- step rail cab -->
  <line x1="35" y1="70" x2="162" y2="70" stroke="#4da3ff" stroke-width="1.5" opacity=".3"/>
  <!-- front wheel -->
  <circle cx="72" cy="80" r="21" fill="rgba(3,9,22,.95)" stroke="#4da3ff" stroke-width="2"/>
  <circle cx="72" cy="80" r="10" fill="none" stroke="#4da3ff" stroke-width="1.3"/>
  <line x1="61" y1="80" x2="83" y2="80" stroke="#4da3ff" stroke-width="1" opacity=".5"/>
  <line x1="72" y1="69" x2="72" y2="91" stroke="#4da3ff" stroke-width="1" opacity=".5"/>
  <circle cx="72" cy="80" r="3.5" fill="#4da3ff" opacity=".6"/>
  <!-- rear wheel -->
  <circle cx="226" cy="80" r="21" fill="rgba(3,9,22,.95)" stroke="#4da3ff" stroke-width="2"/>
  <circle cx="226" cy="80" r="10" fill="none" stroke="#4da3ff" stroke-width="1.3"/>
  <line x1="215" y1="80" x2="237" y2="80" stroke="#4da3ff" stroke-width="1" opacity=".5"/>
  <line x1="226" y1="69" x2="226" y2="91" stroke="#4da3ff" stroke-width="1" opacity=".5"/>
  <circle cx="226" cy="80" r="3.5" fill="#4da3ff" opacity=".6"/>
  <!-- headlight -->
  <ellipse cx="14" cy="57" rx="5" ry="9" fill="rgba(77,163,255,.35)" stroke="#4da3ff" stroke-width="1.2"/>
  <!-- taillight -->
  <rect x="278" y="54" width="4" height="16" rx="2" fill="rgba(77,163,255,.25)" stroke="#4da3ff" stroke-width="1"/>
  <!-- ground line -->
  <line x1="28" y1="100" x2="272" y2="100" stroke="#4da3ff" stroke-width="1" opacity=".18"/>
</svg>
