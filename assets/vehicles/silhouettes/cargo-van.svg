<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-label="Full-size cargo van silhouette">
<defs>
  <linearGradient id="bgcargovan" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F7FAFC"/>
    <stop offset="100%" stop-color="#E8EEF5"/>
  </linearGradient>
  <linearGradient id="bdcargovan" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#475569"/>
    <stop offset="100%" stop-color="#1E293B"/>
  </linearGradient>
  <linearGradient id="glcargovan" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#BFDBFE" stop-opacity=".95"/>
    <stop offset="100%" stop-color="#64748B" stop-opacity=".55"/>
  </linearGradient>
  <radialGradient id="shcargovan" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#0F172A" stop-opacity=".18"/>
    <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="400" height="200" rx="18" fill="url(#bgcargovan)"/>
<ellipse cx="200" cy="168" rx="132" ry="10" fill="url(#shcargovan)"/>

<path d="M42 144 L56 112 L86 98 L108 68 L340 68 L360 98 L378 112 L386 144 Z" fill="url(#bdcargovan)"/>
<!-- cab glass only -->
<path d="M114 70 L128 98 L168 98 L168 70 Z" fill="url(#glcargovan)"/>
