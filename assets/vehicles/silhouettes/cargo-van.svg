<path d="M176 78 L330 78 L330 132 L176 132 Z" fill="#334155" opacity=".35"/>
<path d="M176 98 L176 144" stroke="#0F172A" stroke-width="2.5" opacity=".3"/>
<circle cx="108" cy="144" r="24" fill="#0F172A"/>
<circle cx="108" cy="144" r="17" fill="#334155"/>
<circle cx="108" cy="144" r="4" fill="#94A3B8"/>
<circle cx="330" cy="144" r="24" fill="#0F172A"/>
<circle cx="330" cy="144" r="17" fill="#334155"/>
<circle cx="330" cy="144" r="4" fill="#94A3B8"/>


</svg>
