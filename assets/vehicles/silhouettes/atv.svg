<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-label="ATV silhouette">
<defs>
  <linearGradient id="bgatv" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F7FAFC"/>
    <stop offset="100%" stop-color="#E8EEF5"/>
  </linearGradient>
  <linearGradient id="bdatv" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#475569"/>
    <stop offset="100%" stop-color="#1E293B"/>
  </linearGradient>
  <linearGradient id="glatv" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#BFDBFE" stop-opacity=".95"/>
    <stop offset="100%" stop-color="#64748B" stop-opacity=".55"/>
  </linearGradient>
  <radialGradient id="shatv" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#0F172A" stop-opacity=".18"/>
    <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="400" height="200" rx="18" fill="url(#bgatv)"/>
<ellipse cx="200" cy="168" rx="132" ry="10" fill="url(#shatv)"/>

<circle cx="110" cy="142" r="26" fill="#0F172A"/>
<circle cx="110" cy="142" r="19" fill="#334155"/>
<circle cx="110" cy="142" r="4" fill="#94A3B8"/>
<circle cx="290" cy="142" r="26" fill="#0F172A"/>
<circle cx="290" cy="142" r="19" fill="#334155"/>
<circle cx="290" cy="142" r="4" fill="#94A3B8"/>
<!-- low wide body -->
<path d="M90 130 L110 108 L160 100 L250 100 L300 108 L320 130 L300 138 L110 138 Z" fill="url(#bdatv)"/>
<path d="M150 104 L170 118 L240 118 L260 104 Z" fill="url(#glatv)"/>
<!-- handlebar -->
<path d="M185 104 L185 88 L220 88 L220 104" fill="none" stroke="#1E293B" stroke-width="4" stroke-linecap="round"/>


</svg>
