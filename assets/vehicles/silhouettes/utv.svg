<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-label="UTV side-by-side silhouette">
<defs>
  <linearGradient id="bgutv" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F7FAFC"/>
    <stop offset="100%" stop-color="#E8EEF5"/>
  </linearGradient>
  <linearGradient id="bdutv" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#475569"/>
    <stop offset="100%" stop-color="#1E293B"/>
  </linearGradient>
  <linearGradient id="glutv" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#BFDBFE" stop-opacity=".95"/>
    <stop offset="100%" stop-color="#64748B" stop-opacity=".55"/>
  </linearGradient>
  <radialGradient id="shutv" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#0F172A" stop-opacity=".18"/>
    <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="400" height="200" rx="18" fill="url(#bgutv)"/>
<ellipse cx="200" cy="168" rx="132" ry="10" fill="url(#shutv)"/>

<circle cx="100" cy="144" r="26" fill="#0F172A"/>
<circle cx="100" cy="144" r="19" fill="#334155"/>
<circle cx="100" cy="144" r="4" fill="#94A3B8"/>
<circle cx="310" cy="144" r="26" fill="#0F172A"/>
<circle cx="310" cy="144" r="19" fill="#334155"/>
<circle cx="310" cy="144" r="4" fill="#94A3B8"/>
<!-- longer side-by-side cabin with roll cage -->
<path d="M78 138 L92 112 L120 100 L150 78 L280 78 L310 100 L340 112 L350 138 Z" fill="url(#bdutv)"/>
<path d="M156 80 L170 102 L268 102 L280 80 Z" fill="url(#glutv)"/>
<!-- roll cage -->
<path d="M150 78 L150 128 M280 78 L280 128 M150 78 L280 78" fill="none" stroke="#0F172A" stroke-width="3.5" opacity=".55"/>
<!-- bed stub -->
<path d="M280 102 L330 108 L330 128 L280 128 Z" fill="#334155" opacity=".4"/>


</svg>
