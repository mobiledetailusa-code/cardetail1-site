<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-label="Jet ski silhouette">
<defs>
  <linearGradient id="bgjetski" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F7FAFC"/>
    <stop offset="100%" stop-color="#E8EEF5"/>
  </linearGradient>
  <linearGradient id="bdjetski" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#475569"/>
    <stop offset="100%" stop-color="#1E293B"/>
  </linearGradient>
  <linearGradient id="gljetski" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#BFDBFE" stop-opacity=".95"/>
    <stop offset="100%" stop-color="#64748B" stop-opacity=".55"/>
  </linearGradient>
  <radialGradient id="shjetski" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#0F172A" stop-opacity=".18"/>
    <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="400" height="200" rx="18" fill="url(#bgjetski)"/>
<ellipse cx="200" cy="168" rx="132" ry="10" fill="url(#shjetski)"/>

<!-- hull -->
<path d="M70 128 C110 108, 160 98, 220 100 C280 102, 330 112, 350 128 C320 142, 200 148, 100 142 Z" fill="url(#bdjetski)"/>
<!-- seat / console -->
<path d="M180 108 L210 92 L240 100 L230 118 L190 120 Z" fill="#334155"/>
<path d="M210 94 L228 100 L220 110 L206 106 Z" fill="url(#gljetski)"/>
<!-- handlebar -->
<path d="M228 100 L248 86 L262 92" fill="none" stroke="#1E293B" stroke-width="3.5" stroke-linecap="round"/>
<!-- water line hint -->
<path d="M80 148 Q200 156 340 148" fill="none" stroke="#93C5FD" stroke-width="3" opacity=".55"/>


</svg>
