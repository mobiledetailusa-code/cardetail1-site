<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 110" fill="none" role="img" aria-label="Motorcycle">
  <!-- rear wheel -->
  <circle cx="60" cy="78" r="26" fill="rgba(3,9,22,.95)" stroke="#4da3ff" stroke-width="2"/>
  <circle cx="60" cy="78" r="14" fill="none" stroke="#4da3ff" stroke-width="1.4"/>
  <line x1="46" y1="78" x2="74" y2="78" stroke="#4da3ff" stroke-width="1" opacity=".5"/>
  <line x1="60" y1="64" x2="60" y2="92" stroke="#4da3ff" stroke-width="1" opacity=".5"/>
  <circle cx="60" cy="78" r="4" fill="#4da3ff" opacity=".6"/>
  <!-- front wheel -->
  <circle cx="200" cy="78" r="26" fill="rgba(3,9,22,.95)" stroke="#4da3ff" stroke-width="2"/>
  <circle cx="200" cy="78" r="14" fill="none" stroke="#4da3ff" stroke-width="1.4"/>
  <line x1="186" y1="78" x2="214" y2="78" stroke="#4da3ff" stroke-width="1" opacity=".5"/>
  <line x1="200" y1="64" x2="200" y2="92" stroke="#4da3ff" stroke-width="1" opacity=".5"/>
  <circle cx="200" cy="78" r="4" fill="#4da3ff" opacity=".6"/>
  <!-- frame / swing arm rear -->
  <line x1="60" y1="78" x2="110" y2="58" stroke="#4da3ff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- main frame -->
  <path d="M110,58 L116,44 L130,36 L148,34 L160,38 L168,52" stroke="#4da3ff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- front forks -->
  <path d="M168,52 L180,60 L200,78" stroke="#4da3ff" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M166,48 L178,56 L196,74" stroke="#4da3ff" stroke-width="1.2" fill="none" stroke-linecap="round" opacity=".4"/>
  <!-- engine block -->
  <rect x="108" y="54" width="56" height="32" rx="5" fill="rgba(5,14,32,.9)" stroke="#4da3ff" stroke-width="1.5"/>
  <!-- cylinder/exhaust hint -->
  <path d="M110,80 Q100,84 86,86 Q78,87 72,86" stroke="#4da3ff" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- fuel tank -->
  <path d="M126,34 Q140,26 160,28 L162,36 L126,40 Z" fill="rgba(77,163,255,.1)" stroke="#4da3ff" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- seat -->
  <path d="M110,42 Q118,36 140,34 Q152,34 162,38 L160,48 Q146,44 120,46 Z" fill="rgba(5,14,32,.8)" stroke="#4da3ff" stroke-width="1.3" stroke-linejoin="round"/>
  <!-- handlebars -->
  <path d="M168,36 L176,28 L192,28" stroke="#4da3ff" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M168,36 L160,28 L144,26" stroke="#4da3ff" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- headlight -->
  <ellipse cx="206" cy="60" rx="8" ry="10" fill="rgba(77,163,255,.12)" stroke="#4da3ff" stroke-width="1.4"/>
  <ellipse cx="206" cy="60" rx="4" ry="5" fill="rgba(77,163,255,.3)"/>
  <!-- ground line -->
  <line x1="24" y1="104" x2="230" y2="104" stroke="#4da3ff" stroke-width="1" opacity=".18"/>
</svg>
