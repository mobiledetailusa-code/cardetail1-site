<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 110" fill="none" role="img" aria-label="ATV / UTV">
  <!-- rear wheel (wide) -->
  <circle cx="56" cy="76" r="28" fill="rgba(3,9,22,.95)" stroke="#4da3ff" stroke-width="2.2"/>
  <circle cx="56" cy="76" r="16" fill="none" stroke="#4da3ff" stroke-width="1.4"/>
  <!-- tire tread lines -->
  <path d="M32,68 L44,60" stroke="#4da3ff" stroke-width="1" opacity=".3"/>
  <path d="M30,76 L44,76" stroke="#4da3ff" stroke-width="1" opacity=".3"/>
  <path d="M32,84 L44,92" stroke="#4da3ff" stroke-width="1" opacity=".3"/>
  <circle cx="56" cy="76" r="5" fill="#4da3ff" opacity=".5"/>
  <!-- front wheel (wide) -->
  <circle cx="204" cy="76" r="28" fill="rgba(3,9,22,.95)" stroke="#4da3ff" stroke-width="2.2"/>
  <circle cx="204" cy="76" r="16" fill="none" stroke="#4da3ff" stroke-width="1.4"/>
  <path d="M180,68 L192,60" stroke="#4da3ff" stroke-width="1" opacity=".3"/>
  <path d="M178,76 L192,76" stroke="#4da3ff" stroke-width="1" opacity=".3"/>
  <path d="M180,84 L192,92" stroke="#4da3ff" stroke-width="1" opacity=".3"/>
  <circle cx="204" cy="76" r="5" fill="#4da3ff" opacity=".5"/>
  <!-- frame / chassis -->
  <path d="M56,60 L70,46 L90,40 L174,40 L192,46 L204,60" stroke="#4da3ff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- body / fender area -->
  <path d="M68,46 L72,30 L100,22 L164,22 L188,30 L192,46 Z" fill="rgba(5,14,32,.9)" stroke="#4da3ff" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- seat -->
  <rect x="100" y="22" width="64" height="14" rx="4" fill="rgba(77,163,255,.08)" stroke="#4da3ff" stroke-width="1.3"/>
  <!-- handlebars -->
  <path d="M118,22 L118,12 L148,12 L148,22" stroke="#4da3ff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="118" y1="12" x2="104" y2="10" stroke="#4da3ff" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="148" y1="12" x2="162" y2="10" stroke="#4da3ff" stroke-width="1.6" stroke-linecap="round"/>
  <!-- foot pegs -->
  <line x1="74" y1="54" x2="60" y2="60" stroke="#4da3ff" stroke-width="1.5"/>
  <line x1="188" y1="54" x2="202" y2="60" stroke="#4da3ff" stroke-width="1.5"/>
  <!-- engine cover -->
  <rect x="104" y="38" width="56" height="16" rx="3" fill="rgba(77,163,255,.06)" stroke="#4da3ff" stroke-width="1"/>
  <!-- front headlight -->
  <ellipse cx="198" cy="42" rx="7" ry="9" fill="rgba(77,163,255,.15)" stroke="#4da3ff" stroke-width="1.3"/>
  <!-- exhaust -->
  <path d="M76,50 Q68,56 62,60" stroke="#4da3ff" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- ground line -->
  <line x1="20" y1="104" x2="240" y2="104" stroke="#4da3ff" stroke-width="1" opacity=".18"/>
</svg>
