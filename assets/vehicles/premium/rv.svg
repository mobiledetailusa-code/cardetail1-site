<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-label="Premium RV motorhome visual">
<defs>
<radialGradient id="bg" cx="50%" cy="60%" r="72%"><stop offset="0%" stop-color="#0c1e3a"/><stop offset="100%" stop-color="#010408"/></radialGradient>
<linearGradient id="bd" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1c3c6a"/><stop offset="45%" stop-color="#0d2040"/><stop offset="100%" stop-color="#060f1e"/></linearGradient>
<linearGradient id="rf" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#254e98"/><stop offset="100%" stop-color="#112650"/></linearGradient>
<linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8ec8f2" stop-opacity=".22"/><stop offset="100%" stop-color="#1840b8" stop-opacity=".05"/></linearGradient>
<radialGradient id="wh" cx="38%" cy="32%" r="68%"><stop offset="0%" stop-color="#1e3058"/><stop offset="100%" stop-color="#040c1e"/></radialGradient>
<radialGradient id="sh" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#000c20" stop-opacity=".88"/><stop offset="100%" stop-color="#000" stop-opacity="0"/></radialGradient>
</defs>
<rect width="400" height="200" fill="url(#bg)"/>
<ellipse cx="205" cy="184" rx="170" ry="9" fill="url(#sh)"/>
<!-- body shadow (tall, long) -->
<path d="M377,150 L377,38 L364,28 L44,28 L36,36 L36,150Z" fill="#02060d"/>
<!-- main body -->
<path d="M375,148 L375,36 L362,26 L42,26 L34,34 L34,148Z" fill="url(#bd)"/>
<!-- roof panel -->
<rect x="42" y="26" width="320" height="18" rx="2" fill="url(#rf)"/>
<!-- windshield (large, front-facing) -->
<rect x="330" y="44" width="46" height="56" rx="3" fill="url(#gl)"/>
<!-- windshield highlight -->
<rect x="334" y="48" width="18" height="20" rx="2" fill="white" fill-opacity=".08"/>
<!-- driver side window -->
<rect x="288" y="44" width="40" height="36" rx="3" fill="url(#gl)"/>
<!-- side windows (living area) -->
<rect x="220" y="44" width="50" height="32" rx="3" fill="url(#gl)"/>
<rect x="148" y="44" width="50" height="32" rx="3" fill="url(#gl)"/>
<rect x="76" y="44" width="50" height="32" rx="3" fill="url(#gl)"/>
<!-- entry door -->
<rect x="168" y="84" width="38" height="58" rx="3" fill="#0d2040" stroke="#4da3ff" stroke-width=".8" opacity=".6"/>
<rect x="172" y="88" width="30" height="50" rx="2" fill="#08182e"/>
<!-- door handle -->
<rect x="195" y="110" width="8" height="4" rx="2" fill="#4da3ff" fill-opacity=".6"/>
<!-- awning suggestion -->
<path d="M76,44 L34,60" stroke="#4da3ff" stroke-width="1.2" opacity=".3" stroke-dasharray="3,3"/>
<!-- accent stripe along body -->
<line x1="34" y1="80" x2="375" y2="80" stroke="#4da3ff" stroke-width="1.5" opacity=".28"/>
<!-- roof AC unit -->
<rect x="160" y="18" width="50" height="10" rx="2" fill="#0a1e3a" stroke="#4da3ff" stroke-width=".8" opacity=".5"/>
<!-- front cap (nose) -->
<path d="M362,26 L375,36 L375,90 L362,90Z" fill="#0f2848"/>
<!-- headlights (wide, horizontal) -->
<rect x="360" y="96" width="16" height="14" rx="3" fill="#cceeff" fill-opacity=".45"/>
<line x1="360" y1="96" x2="376" y2="96" stroke="#a0d8ff" stroke-width="2" opacity=".9"/>
<!-- taillights -->
<rect x="34" y="96" width="10" height="40" rx="2" fill="#c01830" fill-opacity=".7"/>
<line x1="34" y1="96" x2="44" y2="96" stroke="#ff3f52" stroke-width="2" opacity=".8"/>
<!-- front bumper -->
<rect x="358" y="118" width="20" height="26" rx="3" fill="#0c2040"/>
<!-- rear bumper -->
<rect x="24" y="130" width="16" height="16" rx="2" fill="#0c2040"/>
<!-- slideout box -->
<rect x="60" y="100" width="80" height="30" rx="2" fill="#0a1e3a" stroke="#4da3ff" stroke-width=".6" opacity=".4"/>
<!-- front wheel arch -->
<path d="M314,148 Q332,122 358,120 Q378,118 380,148" fill="#010408"/>
<!-- rear wheel arch -->
<path d="M64,148 Q82,122 108,120 Q128,118 132,148" fill="#010408"/>
<!-- front wheel -->
<circle cx="348" cy="162" r="22" fill="url(#wh)"/>
<circle cx="348" cy="162" r="16" fill="none" stroke="#18304e" stroke-width="1.2"/>
<line x1="348" y1="147" x2="348" y2="177" stroke="#4da3ff" stroke-width="1" opacity=".55"/>
<line x1="333" y1="162" x2="363" y2="162" stroke="#4da3ff" stroke-width="1" opacity=".55"/>
<line x1="338" y1="151" x2="358" y2="173" stroke="#4da3ff" stroke-width=".9" opacity=".44"/>
<line x1="358" y1="151" x2="338" y2="173" stroke="#4da3ff" stroke-width=".9" opacity=".44"/>
<circle cx="348" cy="162" r="5" fill="#060e20" stroke="#4da3ff" stroke-width="1"/>
<circle cx="348" cy="162" r="2" fill="#4da3ff" opacity=".65"/>
<!-- rear wheel (dual — suggestion of dual rear) -->
<circle cx="98" cy="162" r="22" fill="url(#wh)"/>
<circle cx="98" cy="162" r="16" fill="none" stroke="#18304e" stroke-width="1.2"/>
<line x1="98" y1="147" x2="98" y2="177" stroke="#4da3ff" stroke-width="1" opacity=".55"/>
<line x1="83" y1="162" x2="113" y2="162" stroke="#4da3ff" stroke-width="1" opacity=".55"/>
<line x1="88" y1="151" x2="108" y2="173" stroke="#4da3ff" stroke-width=".9" opacity=".44"/>
<line x1="108" y1="151" x2="88" y2="173" stroke="#4da3ff" stroke-width=".9" opacity=".44"/>
<circle cx="98" cy="162" r="5" fill="#060e20" stroke="#4da3ff" stroke-width="1"/>
<circle cx="98" cy="162" r="2" fill="#4da3ff" opacity=".65"/>
<!-- sill -->
<rect x="44" y="145" width="318" height="6" rx="1.5" fill="#030810"/>
<path d="M50,150 L366,150" fill="none" stroke="#4da3ff" stroke-width="1.5" opacity=".1" stroke-linecap="round"/>
</svg>
