<rect x="347" y="130" width="18" height="6" rx="2" fill="#0a1e38"/>
<!-- headlight DRL -->
<line x1="345" y1="102" x2="362" y2="106" stroke="#a0d8ff" stroke-width="2.5" stroke-linecap="round" opacity=".92"/>
<path d="M346,104 L363,108 L363,122 L347,120Z" fill="#cceeff" fill-opacity=".38"/>
<!-- taillight -->
<path d="M60,102 L74,104 L74,122 L61,122Z" fill="#c01830" fill-opacity=".68"/>
<line x1="60" y1="102" x2="74" y2="104" stroke="#ff3f52" stroke-width="2" opacity=".8"/>
<!-- roof rack suggestion -->
<line x1="155" y1="56" x2="268" y2="56" stroke="#4da3ff" stroke-width="1" opacity=".18"/>
<!-- front wheel arch -->
<path d="M290,146 Q308,118 336,116 Q360,114 364,146" fill="#010408"/>
<!-- rear wheel arch -->
<path d="M94,146 Q112,118 138,116 Q160,114 164,146" fill="#010408"/>
<!-- front wheel -->
<circle cx="328" cy="158" r="28" fill="url(#wh)"/>
<circle cx="328" cy="158" r="21" fill="none" stroke="#18304e" stroke-width="1.2"/>
<line x1="328" y1="137" x2="328" y2="179" stroke="#4da3ff" stroke-width="1" opacity=".55"/>
<line x1="307" y1="158" x2="349" y2="158" stroke="#4da3ff" stroke-width="1" opacity=".55"/>
<line x1="314" y1="144" x2="342" y2="172" stroke="#4da3ff" stroke-width=".9" opacity=".44"/>
<line x1="342" y1="144" x2="314" y2="172" stroke="#4da3ff" stroke-width=".9" opacity=".44"/>
<circle cx="328" cy="158" r="7" fill="#060e20" stroke="#4da3ff" stroke-width="1"/>
<circle cx="328" cy="158" r="2.5" fill="#4da3ff" opacity=".65"/>
<path d="M309,143 Q299,158 309,173" fill="none" stroke="#4da3ff" stroke-width="1.5" opacity=".28"/>
<!-- rear wheel -->
<circle cx="128" cy="158" r="28" fill="url(#wh)"/>
<circle cx="128" cy="158" r="21" fill="none" stroke="#18304e" stroke-width="1.2"/>
<line x1="128" y1="137" x2="128" y2="179" stroke="#4da3ff" stroke-width="1" opacity=".55"/>
<line x1="107" y1="158" x2="149" y2="158" stroke="#4da3ff" stroke-width="1" opacity=".55"/>
<line x1="114" y1="144" x2="142" y2="172" stroke="#4da3ff" stroke-width=".9" opacity=".44"/>
<line x1="142" y1="144" x2="114" y2="172" stroke="#4da3ff" stroke-width=".9" opacity=".44"/>
<circle cx="128" cy="158" r="7" fill="#060e20" stroke="#4da3ff" stroke-width="1"/>
<circle cx="128" cy="158" r="2.5" fill="#4da3ff" opacity=".65"/>
<path d="M109,143 Q99,158 109,173" fill="none" stroke="#4da3ff" stroke-width="1.5" opacity=".28"/>
<!-- rocker -->
<rect x="80" y="143" width="270" height="5" rx="1.5" fill="#030810"/>
<path d="M88,147 L352,147" fill="none" stroke="#4da3ff" stroke-width="1.5" opacity=".1" stroke-linecap="round"/>
</svg>
