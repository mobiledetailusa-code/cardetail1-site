<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-label="Premium SUV vehicle visual">
<defs>
<radialGradient id="bg" cx="50%" cy="60%" r="72%"><stop offset="0%" stop-color="#0c1e3a"/><stop offset="100%" stop-color="#010408"/></radialGradient>
<linearGradient id="bd" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1c3c6a"/><stop offset="45%" stop-color="#0d2040"/><stop offset="100%" stop-color="#060f1e"/></linearGradient>
<linearGradient id="rf" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#254e98"/><stop offset="100%" stop-color="#112650"/></linearGradient>
<linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8ec8f2" stop-opacity=".24"/><stop offset="100%" stop-color="#1840b8" stop-opacity=".05"/></linearGradient>
<radialGradient id="wh" cx="38%" cy="32%" r="68%"><stop offset="0%" stop-color="#1e3058"/><stop offset="100%" stop-color="#040c1e"/></radialGradient>
<radialGradient id="sh" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#000c20" stop-opacity=".88"/><stop offset="100%" stop-color="#000" stop-opacity="0"/></radialGradient>
</defs>
<rect width="400" height="200" fill="url(#bg)"/>
<ellipse cx="207" cy="182" rx="158" ry="9" fill="url(#sh)"/>
<!-- body shadow -->
<path d="M366,148 L365,122 L352,104 L322,88 L294,90 L270,60 L150,58 L120,88 L104,100 L76,110 L60,124 L50,140 L50,148Z" fill="#02060d"/>
<!-- body main -->
<path d="M364,146 L363,120 L350,102 L320,86 L292,88 L268,58 L148,56 L118,86 L102,98 L74,108 L58,122 L48,138 L48,146Z" fill="url(#bd)"/>
<!-- roof/cabin -->
<path d="M268,58 L292,88 L118,86 L148,56Z" fill="url(#rf)"/>
<!-- glass -->
<path d="M268,58 L291,88 L120,86 L148,56Z" fill="url(#gl)"/>
<!-- glass sub-highlight -->
<path d="M267,60 L283,72 L275,76 L259,66Z" fill="white" fill-opacity=".09"/>
<!-- B-pillar -->
<rect x="207" y="57" width="5" height="31" fill="#08182e" rx="1"/>
<!-- beltline -->
<path d="M80,110 Q200,102 360,110" fill="none" stroke="#4da3ff" stroke-width="1.5" opacity=".38"/>
<!-- roof highlight -->
<path d="M150,56 Q212,48 268,58" fill="none" stroke="white" stroke-width="1.2" opacity=".07"/>
<!-- front bumper -->
<path d="M346,102 L363,106 L364,120 L348,118Z" fill="#0c2040"/>
<!-- rear bumper -->
<path d="M61,120 L49,124 L48,138 L60,136Z" fill="#0c2040"/>
