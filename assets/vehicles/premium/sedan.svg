<rect x="82" y="139" width="268" height="5" rx="1.5" fill="#030810"/>
<!-- underglow -->
<path d="M92,143 L350,143" fill="none" stroke="#4da3ff" stroke-width="1.5" opacity=".1" stroke-linecap="round"/>
</svg>
