<line x1="328" y1="135" x2="328" y2="173" stroke="#4da3ff" stroke-width="1" opacity=".55"/>
<line x1="309" y1="154" x2="347" y2="154" stroke="#4da3ff" stroke-width="1" opacity=".55"/>
<line x1="315" y1="140" x2="341" y2="168" stroke="#4da3ff" stroke-width=".9" opacity=".44"/>
<line x1="341" y1="140" x2="315" y2="168" stroke="#4da3ff" stroke-width=".9" opacity=".44"/>
<circle cx="328" cy="154" r="6" fill="#060e20" stroke="#4da3ff" stroke-width="1"/>
<circle cx="328" cy="154" r="2" fill="#4da3ff" opacity=".65"/>
<path d="M311,140 Q302,154 311,168" fill="none" stroke="#4da3ff" stroke-width="1.5" opacity=".28"/>
