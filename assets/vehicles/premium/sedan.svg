<line x1="126" y1="135" x2="126" y2="173" stroke="#4da3ff" stroke-width="1" opacity=".55"/>
<line x1="107" y1="154" x2="145" y2="154" stroke="#4da3ff" stroke-width="1" opacity=".55"/>
<line x1="113" y1="140" x2="139" y2="168" stroke="#4da3ff" stroke-width=".9" opacity=".44"/>
<line x1="139" y1="140" x2="113" y2="168" stroke="#4da3ff" stroke-width=".9" opacity=".44"/>
<circle cx="126" cy="154" r="6" fill="#060e20" stroke="#4da3ff" stroke-width="1"/>
<circle cx="126" cy="154" r="2" fill="#4da3ff" opacity=".65"/>
<path d="M109,140 Q100,154 109,168" fill="none" stroke="#4da3ff" stroke-width="1.5" opacity=".28"/>
