<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-label="Premium minivan vehicle visual">
<defs>
<radialGradient id="bg" cx="50%" cy="60%" r="72%"><stop offset="0%" stop-color="#0c1e3a"/><stop offset="100%" stop-color="#010408"/></radialGradient>
<linearGradient id="bd" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1c3c6a"/><stop offset="45%" stop-color="#0d2040"/><stop offset="100%" stop-color="#060f1e"/></linearGradient>
<linearGradient id="rf" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#254e98"/><stop offset="100%" stop-color="#112650"/></linearGradient>
<linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8ec8f2" stop-opacity=".22"/><stop offset="100%" stop-color="#1840b8" stop-opacity=".05"/></linearGradient>
<radialGradient id="wh" cx="38%" cy="32%" r="68%"><stop offset="0%" stop-color="#1e3058"/><stop offset="100%" stop-color="#040c1e"/></radialGradient>
<radialGradient id="sh" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#000c20" stop-opacity=".88"/><stop offset="100%" stop-color="#000" stop-opacity="0"/></radialGradient>
</defs>
<rect width="400" height="200" fill="url(#bg)"/>
<ellipse cx="205" cy="182" rx="158" ry="9" fill="url(#sh)"/>
<!-- body shadow -->
<path d="M366,148 L365,126 L354,108 L326,92 L298,90 L276,60 L196,54 L140,54 L100,60 L78,74 L66,92 L56,108 L50,140 L50,148Z" fill="#02060d"/>
<!-- main body (rounded minivan) -->
<path d="M364,146 L363,124 L352,106 L324,90 L296,88 L274,58 L194,52 L138,52 L98,58 L76,72 L64,90 L54,106 L48,138 L48,146Z" fill="url(#bd)"/>
<!-- roof -->
<path d="M274,58 L296,88 L138,52 L194,52Z" fill="url(#rf)"/>
<!-- windshield (sloped) -->
<path d="M296,88 L274,58 L194,52 L178,66 L260,88Z" fill="url(#gl)"/>
<!-- windshield highlight -->
<path d="M272,60 L288,72 L280,76 L264,66Z" fill="white" fill-opacity=".09"/>
<!-- rear liftgate glass -->
<path d="M48,80 L64,90 L64,126 L48,130Z" fill="url(#gl)"/>
<!-- B-pillar -->
<rect x="222" y="56" width="5" height="32" fill="#08182e" rx="1"/>
<!-- side windows front -->
<rect x="184" y="58" width="36" height="28" rx="3" fill="url(#gl)"/>
<!-- side windows mid (sliding door) -->
<rect x="106" y="62" width="40" height="26" rx="3" fill="url(#gl)"/>
<!-- sliding door line -->
<line x1="226" y1="52" x2="226" y2="146" stroke="#4da3ff" stroke-width="1" opacity=".2"/>
<!-- beltline -->
<path d="M68,92 Q200,84 360,94" fill="none" stroke="#4da3ff" stroke-width="1.5" opacity=".35"/>
<!-- roof highlight -->
<path d="M140,52 Q214,45 274,58" fill="none" stroke="white" stroke-width="1.2" opacity=".07"/>
<!-- front bumper -->
<path d="M348,106 L363,110 L364,124 L349,122Z" fill="#0c2040"/>
<!-- rear bumper -->
<path d="M56,104 L48,108 L48,138 L55,136Z" fill="#0c2040"/>
<!-- headlight DRL -->
<line x1="346" y1="106" x2="363" y2="110" stroke="#a0d8ff" stroke-width="2.5" stroke-linecap="round" opacity=".92"/>
<path d="M347,108 L363,112 L363,124 L349,122Z" fill="#cceeff" fill-opacity=".38"/>
<!-- taillight -->
<path d="M56,106 L70,108 L70,128 L57,128Z" fill="#c01830" fill-opacity=".68"/>
<line x1="56" y1="106" x2="70" y2="108" stroke="#ff3f52" stroke-width="2" opacity=".8"/>
<!-- step rail -->
<line x1="68" y1="130" x2="354" y2="130" stroke="#4da3ff" stroke-width="1" opacity=".22"/>
<!-- front wheel arch -->
<path d="M292,146 Q310,118 338,116 Q362,114 366,146" fill="#010408"/>
<!-- rear wheel arch -->
<path d="M86,146 Q104,118 130,116 Q154,114 158,146" fill="#010408"/>
<!-- front wheel -->
<circle cx="328" cy="158" r="26" fill="url(#wh)"/>
<circle cx="328" cy="158" r="20" fill="none" stroke="#18304e" stroke-width="1.2"/>
<line x1="328" y1="139" x2="328" y2="177" stroke="#4da3ff" stroke-width="1" opacity=".55"/>
<line x1="309" y1="158" x2="347" y2="158" stroke="#4da3ff" stroke-width="1" opacity=".55"/>
<line x1="315" y1="144" x2="341" y2="172" stroke="#4da3ff" stroke-width=".9" opacity=".44"/>
<line x1="341" y1="144" x2="315" y2="172" stroke="#4da3ff" stroke-width=".9" opacity=".44"/>
<circle cx="328" cy="158" r="6" fill="#060e20" stroke="#4da3ff" stroke-width="1"/>
<circle cx="328" cy="158" r="2.5" fill="#4da3ff" opacity=".65"/>
<path d="M311,144 Q302,158 311,172" fill="none" stroke="#4da3ff" stroke-width="1.5" opacity=".28"/>
<!-- rear wheel -->
<circle cx="122" cy="158" r="26" fill="url(#wh)"/>
<circle cx="122" cy="158" r="20" fill="none" stroke="#18304e" stroke-width="1.2"/>
<line x1="122" y1="139" x2="122" y2="177" stroke="#4da3ff" stroke-width="1" opacity=".55"/>
<line x1="103" y1="158" x2="141" y2="158" stroke="#4da3ff" stroke-width="1" opacity=".55"/>
<line x1="109" y1="144" x2="135" y2="172" stroke="#4da3ff" stroke-width=".9" opacity=".44"/>
<line x1="135" y1="144" x2="109" y2="172" stroke="#4da3ff" stroke-width=".9" opacity=".44"/>
<circle cx="122" cy="158" r="6" fill="#060e20" stroke="#4da3ff" stroke-width="1"/>
<circle cx="122" cy="158" r="2.5" fill="#4da3ff" opacity=".65"/>
<path d="M105,144 Q96,158 105,172" fill="none" stroke="#4da3ff" stroke-width="1.5" opacity=".28"/>
<!-- rocker -->
<rect x="78" y="143" width="268" height="5" rx="1.5" fill="#030810"/>
<path d="M86,147 L350,147" fill="none" stroke="#4da3ff" stroke-width="1.5" opacity=".1" stroke-linecap="round"/>
</svg>
