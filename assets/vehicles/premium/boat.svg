<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-label="Premium boat visual">
<defs>
<radialGradient id="bg" cx="50%" cy="65%" r="75%"><stop offset="0%" stop-color="#081828"/><stop offset="100%" stop-color="#010408"/></radialGradient>
<linearGradient id="bd" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1c3c6a"/><stop offset="45%" stop-color="#0d2040"/><stop offset="100%" stop-color="#060f1e"/></linearGradient>
<linearGradient id="hull" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0e2848"/><stop offset="100%" stop-color="#040c1e"/></linearGradient>
<linearGradient id="wt" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d3060" stop-opacity=".7"/><stop offset="100%" stop-color="#020a18" stop-opacity=".3"/></linearGradient>
<linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8ec8f2" stop-opacity=".2"/><stop offset="100%" stop-color="#1840b8" stop-opacity=".04"/></linearGradient>
<radialGradient id="sh" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#000c20" stop-opacity=".9"/><stop offset="100%" stop-color="#000" stop-opacity="0"/></radialGradient>
</defs>
<rect width="400" height="200" fill="url(#bg)"/>
<!-- water surface -->
<path d="M0,148 Q100,142 200,148 Q300,154 400,148 L400,200 L0,200Z" fill="url(#wt)"/>
<!-- water shimmer lines -->
<path d="M10,150 Q60,146 110,150" fill="none" stroke="#4da3ff" stroke-width=".8" opacity=".18"/>
<path d="M150,152 Q220,148 290,152" fill="none" stroke="#4da3ff" stroke-width=".8" opacity=".15"/>
<path d="M310,150 Q355,146 390,150" fill="none" stroke="#4da3ff" stroke-width=".8" opacity=".14"/>
<!-- hull shadow -->
<path d="M362,150 L380,148 L396,148 L396,162 Q340,170 200,168 Q100,168 24,160 L24,148 L38,148 Z" fill="#02060d"/>
<!-- main hull (center console style) -->
<path d="M360,148 L378,146 L394,146 L394,158 Q340,166 200,164 Q100,164 24,156 L24,144 L40,144Z" fill="url(#hull)"/>
<!-- hull top rail / gunwale -->
<path d="M38,138 Q200,128 382,134 L394,138 L394,146 L382,144 Q200,138 38,144Z" fill="url(#bd)"/>
<!-- gunwale highlight -->
<path d="M40,138 Q200,128 382,134" fill="none" stroke="#4da3ff" stroke-width="1.2" opacity=".4"/>
<!-- bow (front/right) -->
<path d="M378,134 L394,138 L396,148 L394,158 L380,148Z" fill="#0c2040"/>
<!-- transom (rear/left) -->
<path d="M24,138 L24,156 L40,164 L40,144Z" fill="#0c2040"/>
<!-- deck surface -->
<path d="M50,138 Q200,126 374,132 L374,138 Q200,134 50,144Z" fill="#0a1e3a"/>
<!-- center console -->
<rect x="178" y="88" width="56" height="46" rx="4" fill="#0d2040" stroke="#4da3ff" stroke-width=".8" opacity=".6"/>
<rect x="182" y="92" width="48" height="38" rx="3" fill="#08182e"/>
<!-- windshield -->
<path d="M178,88 L202,70 L218,70 L234,88Z" fill="url(#gl)" stroke="#4da3ff" stroke-width=".8" opacity=".6"/>
<path d="M180,88 L202,72 L214,72Z" fill="white" fill-opacity=".06"/>
<!-- T-top/tower -->
<line x1="178" y1="88" x2="162" y2="44" stroke="#4da3ff" stroke-width="1.2" opacity=".5" stroke-linecap="round"/>
<line x1="234" y1="88" x2="250" y2="44" stroke="#4da3ff" stroke-width="1.2" opacity=".5" stroke-linecap="round"/>
<line x1="158" y1="44" x2="254" y2="44" stroke="#4da3ff" stroke-width="1.8" opacity=".55" stroke-linecap="round"/>
<line x1="176" y1="44" x2="176" y2="54" stroke="#4da3ff" stroke-width="1" opacity=".35"/>
<line x1="232" y1="44" x2="232" y2="54" stroke="#4da3ff" stroke-width="1" opacity=".35"/>
<!-- navigation light on top -->
<circle cx="206" cy="40" r="3" fill="#cceeff" fill-opacity=".8"/>
<!-- outboard engine -->
<rect x="24" y="130" width="14" height="28" rx="3" fill="#0e2848" stroke="#4da3ff" stroke-width=".8" opacity=".5"/>
<rect x="26" y="144" width="10" height="8" rx="2" fill="#4da3ff" fill-opacity=".12"/>
<!-- fishing rod holders / cleats -->
<line x1="90" y1="138" x2="92" y2="128" stroke="#4da3ff" stroke-width="1" opacity=".3"/>
<line x1="310" y1="134" x2="312" y2="124" stroke="#4da3ff" stroke-width="1" opacity=".3"/>
<!-- hull stripe accent -->
<path d="M40,148 Q200,144 382,146" fill="none" stroke="#4da3ff" stroke-width="1.2" opacity=".2"/>
<!-- wake / spray -->
<path d="M24,156 Q12,162 4,172" fill="none" stroke="#4da3ff" stroke-width="1" opacity=".18" stroke-linecap="round"/>
<path d="M24,152 Q8,156 2,164" fill="none" stroke="#4da3ff" stroke-width=".8" opacity=".14" stroke-linecap="round"/>
</svg>
