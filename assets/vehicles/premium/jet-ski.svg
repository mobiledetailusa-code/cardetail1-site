<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-label="Premium jet ski PWC visual">
<defs>
<radialGradient id="bg" cx="50%" cy="65%" r="75%"><stop offset="0%" stop-color="#081828"/><stop offset="100%" stop-color="#010408"/></radialGradient>
<linearGradient id="bd" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1c3c6a"/><stop offset="45%" stop-color="#0d2040"/><stop offset="100%" stop-color="#060f1e"/></linearGradient>
<linearGradient id="hull" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0e2848"/><stop offset="100%" stop-color="#040c1e"/></linearGradient>
<linearGradient id="wt" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d3060" stop-opacity=".7"/><stop offset="100%" stop-color="#020a18" stop-opacity=".3"/></linearGradient>
<linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8ec8f2" stop-opacity=".2"/><stop offset="100%" stop-color="#1840b8" stop-opacity=".04"/></linearGradient>
</defs>
<rect width="400" height="200" fill="url(#bg)"/>
<!-- water surface -->
<path d="M0,152 Q100,146 200,152 Q300,158 400,152 L400,200 L0,200Z" fill="url(#wt)"/>
<path d="M20,154 Q80,150 140,154" fill="none" stroke="#4da3ff" stroke-width=".8" opacity=".16"/>
<path d="M220,156 Q300,152 370,156" fill="none" stroke="#4da3ff" stroke-width=".8" opacity=".14"/>
<!-- hull shadow -->
<path d="M54,154 Q200,146 360,152 L370,156 L370,166 Q200,162 40,168 L36,162Z" fill="#02060d"/>
<!-- main hull (low, sleek PWC) -->
<path d="M52,152 Q200,144 358,150 L368,154 L368,164 Q200,160 38,166 L34,160Z" fill="url(#hull)"/>
<!-- hull upper body / deck -->
<path d="M62,140 Q200,128 352,136 L366,148 L358,150 Q200,144 52,152 L40,144Z" fill="url(#bd)"/>
<!-- deck accent line -->
<path d="M64,140 Q200,128 354,136" fill="none" stroke="#4da3ff" stroke-width="1.2" opacity=".4"/>
<!-- bow (pointed front, right) -->
<path d="M352,136 L370,148 L368,164 L354,152 Q360,150 356,140Z" fill="#0c2040"/>
<!-- bow point highlight -->
<path d="M354,138 L368,148" fill="none" stroke="#4da3ff" stroke-width="1.5" opacity=".35" stroke-linecap="round"/>
<!-- transom (rear/left) -->
<path d="M40,144 L34,160 L38,166 L52,152Z" fill="#0c2040"/>
<!-- handlebar tower -->
<rect x="218" y="96" width="10" height="46" rx="3" fill="#0e2848" stroke="#4da3ff" stroke-width=".8" opacity=".6"/>
<!-- handlebars -->
<path d="M196,98 Q212,94 228,96 Q244,94 260,98" fill="none" stroke="#4da3ff" stroke-width="3" stroke-linecap="round" opacity=".7"/>
<line x1="196" y1="98" x2="188" y2="106" stroke="#4da3ff" stroke-width="2.5" stroke-linecap="round" opacity=".6"/>
<line x1="260" y1="98" x2="268" y2="106" stroke="#4da3ff" stroke-width="2.5" stroke-linecap="round" opacity=".6"/>
<!-- mirrors -->
<ellipse cx="186" cy="104" rx="6" ry="4" fill="#08182e" stroke="#4da3ff" stroke-width=".8" opacity=".5"/>
<ellipse cx="270" cy="104" rx="6" ry="4" fill="#08182e" stroke="#4da3ff" stroke-width=".8" opacity=".5"/>
<!-- seat (long, black) -->
<path d="M130,136 Q224,126 316,132 L316,142 Q224,138 130,146Z" fill="#06101e" stroke="#4da3ff" stroke-width=".8" opacity=".5"/>
<!-- seat stitching -->
<path d="M135,138 Q224,130 312,136" fill="none" stroke="#4da3ff" stroke-width=".6" opacity=".25" stroke-dasharray="4,6"/>
<!-- nose light / headlight -->
<ellipse cx="360" cy="148" rx="8" ry="6" fill="#cceeff" fill-opacity=".45" stroke="#4da3ff" stroke-width=".8"/>
<ellipse cx="360" cy="148" rx="4" ry="3" fill="white" fill-opacity=".6"/>
<!-- jet pump nozzle (rear) -->
<rect x="30" y="156" width="14" height="8" rx="2" fill="#0e2848"/>
<path d="M30,160 L18,162 L18,160Z" fill="#4da3ff" fill-opacity=".3"/>
<!-- wake spray -->
<path d="M36,160 Q22,168 10,178" fill="none" stroke="#4da3ff" stroke-width="1.2" opacity=".22" stroke-linecap="round"/>
<path d="M38,164 Q26,170 16,182" fill="none" stroke="#4da3ff" stroke-width=".8" opacity=".16" stroke-linecap="round"/>
<path d="M40,168 Q28,172 20,182" fill="none" stroke="#4da3ff" stroke-width=".6" opacity=".12" stroke-linecap="round"/>
<!-- hull stripe -->
<path d="M46,148 Q200,140 358,146" fill="none" stroke="#4da3ff" stroke-width="1.2" opacity=".2"/>
</svg>
