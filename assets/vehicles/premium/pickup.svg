<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-label="Premium pickup truck visual">
<defs>
<radialGradient id="bg" cx="50%" cy="60%" r="72%"><stop offset="0%" stop-color="#0c1e3a"/><stop offset="100%" stop-color="#010408"/></radialGradient>
<linearGradient id="bd" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1c3c6a"/><stop offset="45%" stop-color="#0d2040"/><stop offset="100%" stop-color="#060f1e"/></linearGradient>
<linearGradient id="rf" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#254e98"/><stop offset="100%" stop-color="#112650"/></linearGradient>
<linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8ec8f2" stop-opacity=".22"/><stop offset="100%" stop-color="#1840b8" stop-opacity=".05"/></linearGradient>
<radialGradient id="wh" cx="38%" cy="32%" r="68%"><stop offset="0%" stop-color="#1e3058"/><stop offset="100%" stop-color="#040c1e"/></radialGradient>
<radialGradient id="sh" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#000c20" stop-opacity=".88"/><stop offset="100%" stop-color="#000" stop-opacity="0"/></radialGradient>
</defs>
<rect width="400" height="200" fill="url(#bg)"/>
<ellipse cx="207" cy="183" rx="162" ry="9" fill="url(#sh)"/>
<!-- truck body: cab section (right/front) + bed (left/rear) -->
<!-- cab shadow -->
<path d="M370,148 L368,122 L356,104 L326,88 L298,90 L274,62 L178,60 L162,80 L152,92 L152,148Z" fill="#02060d"/>
<!-- cab body -->
<path d="M368,146 L366,120 L354,102 L324,86 L296,88 L272,60 L176,58 L160,78 L150,90 L150,146Z" fill="url(#bd)"/>
<!-- cab roof -->
<path d="M272,60 L296,88 L160,78 L176,58Z" fill="url(#rf)"/>
<!-- glass -->
<path d="M272,60 L295,88 L162,78 L176,58Z" fill="url(#gl)"/>
<!-- glass highlight -->
<path d="M271,62 L287,74 L279,78 L263,68Z" fill="white" fill-opacity=".09"/>
<!-- bed shadow -->
<path d="M152,100 L152,148 L46,148 L46,100Z" fill="#02060d"/>
<!-- bed walls -->
<path d="M150,98 L150,146 L44,146 L44,106 L68,100 L150,98Z" fill="url(#bd)"/>
<!-- bed floor/inside (darker) -->
<rect x="44" y="98" width="106" height="8" fill="#060f22"/>
<!-- bed top rail -->
<line x1="44" y1="98" x2="150" y2="98" stroke="#4da3ff" stroke-width="1.5" opacity=".3"/>
<!-- bed stake holes suggestion -->
<rect x="60" y="100" width="3" height="8" rx="1" fill="#4da3ff" fill-opacity=".18"/>
<rect x="96" y="100" width="3" height="8" rx="1" fill="#4da3ff" fill-opacity=".18"/>
<rect x="132" y="100" width="3" height="8" rx="1" fill="#4da3ff" fill-opacity=".18"/>
<!-- step rail -->
<line x1="148" y1="132" x2="366" y2="132" stroke="#4da3ff" stroke-width="1.2" opacity=".25"/>
<!-- beltline highlight (cab) -->
<path d="M155,92 Q260,86 366,94" fill="none" stroke="#4da3ff" stroke-width="1.5" opacity=".38"/>
<!-- roof highlight -->
<path d="M178,58 Q228,52 272,60" fill="none" stroke="white" stroke-width="1.2" opacity=".07"/>
<!-- front bumper -->
<path d="M350,102 L366,106 L368,120 L352,118Z" fill="#0c2040"/>
<!-- chrome bumper face -->
<rect x="350" y="130" width="20" height="10" rx="2" fill="#0e2848" stroke="#4da3ff" stroke-width=".5" opacity=".5"/>
<!-- headlight DRL -->
<line x1="348" y1="102" x2="366" y2="106" stroke="#a0d8ff" stroke-width="2.5" stroke-linecap="round" opacity=".92"/>
<path d="M349,104 L366,108 L366,122 L350,120Z" fill="#cceeff" fill-opacity=".38"/>
<!-- taillight -->
<path d="M46,108 L60,110 L60,144 L46,144Z" fill="#c01830" fill-opacity=".7"/>
<line x1="46" y1="108" x2="60" y2="110" stroke="#ff3f52" stroke-width="2" opacity=".8"/>
<!-- front wheel arch -->
<path d="M294,146 Q314,116 344,114 Q368,112 370,146" fill="#010408"/>
<!-- rear wheel arch -->
<path d="M82,146 Q104,116 132,114 Q155,112 158,146" fill="#010408"/>
<!-- front wheel -->
<circle cx="334" cy="160" r="28" fill="url(#wh)"/>
<circle cx="334" cy="160" r="21" fill="none" stroke="#18304e" stroke-width="1.2"/>
<line x1="334" y1="139" x2="334" y2="181" stroke="#4da3ff" stroke-width="1" opacity=".55"/>
<line x1="313" y1="160" x2="355" y2="160" stroke="#4da3ff" stroke-width="1" opacity=".55"/>
<line x1="320" y1="146" x2="348" y2="174" stroke="#4da3ff" stroke-width=".9" opacity=".44"/>
<line x1="348" y1="146" x2="320" y2="174" stroke="#4da3ff" stroke-width=".9" opacity=".44"/>
<circle cx="334" cy="160" r="7" fill="#060e20" stroke="#4da3ff" stroke-width="1"/>
<circle cx="334" cy="160" r="2.5" fill="#4da3ff" opacity=".65"/>
<path d="M315,145 Q305,160 315,175" fill="none" stroke="#4da3ff" stroke-width="1.5" opacity=".28"/>
<!-- rear wheel -->
<circle cx="122" cy="160" r="28" fill="url(#wh)"/>
<circle cx="122" cy="160" r="21" fill="none" stroke="#18304e" stroke-width="1.2"/>
<line x1="122" y1="139" x2="122" y2="181" stroke="#4da3ff" stroke-width="1" opacity=".55"/>
<line x1="101" y1="160" x2="143" y2="160" stroke="#4da3ff" stroke-width="1" opacity=".55"/>
<line x1="108" y1="146" x2="136" y2="174" stroke="#4da3ff" stroke-width=".9" opacity=".44"/>
<line x1="136" y1="146" x2="108" y2="174" stroke="#4da3ff" stroke-width=".9" opacity=".44"/>
<circle cx="122" cy="160" r="7" fill="#060e20" stroke="#4da3ff" stroke-width="1"/>
<circle cx="122" cy="160" r="2.5" fill="#4da3ff" opacity=".65"/>
<path d="M103,145 Q93,160 103,175" fill="none" stroke="#4da3ff" stroke-width="1.5" opacity=".28"/>
<!-- rocker -->
<rect x="158" y="143" width="194" height="6" rx="1.5" fill="#030810"/>
<path d="M164,148 L356,148" fill="none" stroke="#4da3ff" stroke-width="1.5" opacity=".1" stroke-linecap="round"/>
</svg>
