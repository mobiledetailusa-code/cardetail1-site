<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-label="Premium full-size SUV vehicle visual">
<defs>
<radialGradient id="bg" cx="50%" cy="60%" r="72%"><stop offset="0%" stop-color="#0c1e3a"/><stop offset="100%" stop-color="#010408"/></radialGradient>
<linearGradient id="bd" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1c3c6a"/><stop offset="45%" stop-color="#0d2040"/><stop offset="100%" stop-color="#060f1e"/></linearGradient>
<linearGradient id="rf" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#254e98"/><stop offset="100%" stop-color="#112650"/></linearGradient>
<linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8ec8f2" stop-opacity=".24"/><stop offset="100%" stop-color="#1840b8" stop-opacity=".05"/></linearGradient>
<radialGradient id="wh" cx="38%" cy="32%" r="68%"><stop offset="0%" stop-color="#1e3058"/><stop offset="100%" stop-color="#040c1e"/></radialGradient>
<radialGradient id="sh" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#000c20" stop-opacity=".88"/><stop offset="100%" stop-color="#000" stop-opacity="0"/></radialGradient>
</defs>
<rect width="400" height="200" fill="url(#bg)"/>
<ellipse cx="207" cy="182" rx="162" ry="9" fill="url(#sh)"/>
<!-- body shadow -->
<path d="M370,148 L369,120 L355,100 L326,84 L296,86 L272,54 L148,52 L116,84 L100,96 L72,106 L58,120 L46,140 L46,148Z" fill="#02060d"/>
<!-- body -->
<path d="M368,146 L367,118 L353,98 L324,82 L294,84 L270,52 L146,50 L114,82 L98,94 L70,104 L56,118 L44,138 L44,146Z" fill="url(#bd)"/>
<!-- roof/cabin -->
<path d="M270,52 L294,84 L114,82 L146,50Z" fill="url(#rf)"/>
<!-- glass -->
<path d="M270,52 L293,84 L116,82 L146,50Z" fill="url(#gl)"/>
<!-- B-pillar (front-rear split) -->
<rect x="196" y="51" width="5" height="33" fill="#08182e" rx="1"/>
<!-- C-pillar -->
<rect x="142" y="51" width="5" height="33" fill="#08182e" rx="1" opacity=".7"/>
<!-- glass sub-highlight -->
<path d="M269,54 L286,66 L278,70 L261,60Z" fill="white" fill-opacity=".09"/>
<!-- beltline -->
<path d="M76,106 Q200,98 364,106" fill="none" stroke="#4da3ff" stroke-width="1.5" opacity=".38"/>
<!-- roof highlight -->
<path d="M148,50 Q212,42 270,52" fill="none" stroke="white" stroke-width="1.2" opacity=".07"/>
<!-- roof rack -->
<line x1="153" y1="50" x2="268" y2="50" stroke="#4da3ff" stroke-width="1" opacity=".2"/>
<!-- front bumper -->
<path d="M348,98 L367,102 L368,118 L350,116Z" fill="#0c2040"/>
<!-- skid plate -->
<rect x="350" y="128" width="20" height="8" rx="2" fill="#0a1e38"/>
<!-- rear bumper -->
<path d="M59,116 L45,120 L44,138 L57,136Z" fill="#0c2040"/>
<!-- headlight DRL -->
<line x1="346" y1="98" x2="366" y2="102" stroke="#a0d8ff" stroke-width="2.5" stroke-linecap="round" opacity=".92"/>
<path d="M347,100 L366,104 L366,118 L349,116Z" fill="#cceeff" fill-opacity=".38"/>
<!-- taillight -->
<path d="M57,98 L72,100 L72,118 L58,118Z" fill="#c01830" fill-opacity=".68"/>
<line x1="57" y1="98" x2="72" y2="100" stroke="#ff3f52" stroke-width="2" opacity=".8"/>
<!-- front wheel arch -->
<path d="M292,146 Q312,116 342,114 Q366,112 370,146" fill="#010408"/>
<!-- rear wheel arch -->
<path d="M88,146 Q108,116 136,114 Q158,112 162,146" fill="#010408"/>
<!-- front wheel -->
<circle cx="332" cy="160" r="28" fill="url(#wh)"/>
<circle cx="332" cy="160" r="21" fill="none" stroke="#18304e" stroke-width="1.2"/>
<line x1="332" y1="139" x2="332" y2="181" stroke="#4da3ff" stroke-width="1" opacity=".55"/>
<line x1="311" y1="160" x2="353" y2="160" stroke="#4da3ff" stroke-width="1" opacity=".55"/>
<line x1="318" y1="146" x2="346" y2="174" stroke="#4da3ff" stroke-width=".9" opacity=".44"/>
<line x1="346" y1="146" x2="318" y2="174" stroke="#4da3ff" stroke-width=".9" opacity=".44"/>
<circle cx="332" cy="160" r="7" fill="#060e20" stroke="#4da3ff" stroke-width="1"/>
<circle cx="332" cy="160" r="2.5" fill="#4da3ff" opacity=".65"/>
<path d="M313,145 Q303,160 313,175" fill="none" stroke="#4da3ff" stroke-width="1.5" opacity=".28"/>
<!-- rear wheel -->
<circle cx="122" cy="160" r="28" fill="url(#wh)"/>
<circle cx="122" cy="160" r="21" fill="none" stroke="#18304e" stroke-width="1.2"/>
<line x1="122" y1="139" x2="122" y2="181" stroke="#4da3ff" stroke-width="1" opacity=".55"/>
<line x1="101" y1="160" x2="143" y2="160" stroke="#4da3ff" stroke-width="1" opacity=".55"/>
<line x1="108" y1="146" x2="136" y2="174" stroke="#4da3ff" stroke-width=".9" opacity=".44"/>
<line x1="136" y1="146" x2="108" y2="174" stroke="#4da3ff" stroke-width=".9" opacity=".44"/>
<circle cx="122" cy="160" r="7" fill="#060e20" stroke="#4da3ff" stroke-width="1"/>
<circle cx="122" cy="160" r="2.5" fill="#4da3ff" opacity=".65"/>
<path d="M103,145 Q93,160 103,175" fill="none" stroke="#4da3ff" stroke-width="1.5" opacity=".28"/>
<!-- rocker -->
<rect x="76" y="143" width="276" height="6" rx="1.5" fill="#030810"/>
<path d="M84,148 L356,148" fill="none" stroke="#4da3ff" stroke-width="1.5" opacity=".1" stroke-linecap="round"/>
</svg>
