<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-label="Premium full-size van vehicle visual">
<defs>
<radialGradient id="bg" cx="50%" cy="60%" r="72%"><stop offset="0%" stop-color="#0c1e3a"/><stop offset="100%" stop-color="#010408"/></radialGradient>
<linearGradient id="bd" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1c3c6a"/><stop offset="45%" stop-color="#0d2040"/><stop offset="100%" stop-color="#060f1e"/></linearGradient>
<linearGradient id="rf" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#254e98"/><stop offset="100%" stop-color="#112650"/></linearGradient>
<linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8ec8f2" stop-opacity=".22"/><stop offset="100%" stop-color="#1840b8" stop-opacity=".05"/></linearGradient>
<radialGradient id="wh" cx="38%" cy="32%" r="68%"><stop offset="0%" stop-color="#1e3058"/><stop offset="100%" stop-color="#040c1e"/></radialGradient>
<radialGradient id="sh" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#000c20" stop-opacity=".88"/><stop offset="100%" stop-color="#000" stop-opacity="0"/></radialGradient>
</defs>
<rect width="400" height="200" fill="url(#bg)"/>
<ellipse cx="205" cy="183" rx="158" ry="9" fill="url(#sh)"/>
<!-- body shadow -->
<path d="M368,150 L368,68 L350,52 L62,52 L48,64 L48,150Z" fill="#02060d"/>
<!-- main body (tall, boxy — Sprinter/Transit style) -->
<path d="M366,148 L366,66 L348,50 L60,50 L46,62 L46,148Z" fill="url(#bd)"/>
<!-- roof (separate highlight) -->
<rect x="60" y="50" width="288" height="16" fill="url(#rf)" rx="1"/>
<!-- windshield -->
<path d="M348,50 L366,66 L366,90 L334,90 L334,50Z" fill="url(#gl)"/>
<!-- windshield highlight -->
<path d="M350,52 L362,62 L356,66 L344,58Z" fill="white" fill-opacity=".1"/>
<!-- rear glass -->
<rect x="46" y="66" width="18" height="42" rx="2" fill="url(#gl)"/>
<!-- side windows (high-roof van) -->
<rect x="76" y="66" width="52" height="38" rx="3" fill="url(#gl)"/>
<rect x="140" y="66" width="52" height="38" rx="3" fill="url(#gl)"/>
<rect x="204" y="66" width="52" height="38" rx="3" fill="url(#gl)"/>
<!-- sliding door line -->
<line x1="200" y1="50" x2="200" y2="148" stroke="#4da3ff" stroke-width="1" opacity=".22"/>
<!-- beltline -->
<line x1="46" y1="108" x2="366" y2="108" stroke="#4da3ff" stroke-width="1.2" opacity=".3"/>
<!-- roof edge highlight -->
<line x1="60" y1="50" x2="348" y2="50" stroke="#4da3ff" stroke-width="1" opacity=".2"/>
<!-- front bumper -->
<rect x="348" y="118" width="20" height="22" rx="3" fill="#0c2040"/>
<!-- headlight DRL -->
<line x1="347" y1="94" x2="366" y2="94" stroke="#a0d8ff" stroke-width="2.5" stroke-linecap="round" opacity=".92"/>
<rect x="348" y="96" width="18" height="20" rx="2" fill="#cceeff" fill-opacity=".35"/>
<!-- taillight -->
<rect x="46" y="110" width="6" height="32" rx="2" fill="#c01830" fill-opacity=".7"/>
<line x1="46" y1="110" x2="52" y2="110" stroke="#ff3f52" stroke-width="2" opacity=".8"/>
<!-- front wheel arch -->
<path d="M296,148 Q316,118 348,116 Q370,114 370,148" fill="#010408"/>
<!-- rear wheel arch -->
<path d="M92,148 Q112,118 140,116 Q162,114 166,148" fill="#010408"/>
<!-- front wheel -->
<circle cx="334" cy="162" r="24" fill="url(#wh)"/>
<circle cx="334" cy="162" r="18" fill="none" stroke="#18304e" stroke-width="1.2"/>
<line x1="334" y1="145" x2="334" y2="179" stroke="#4da3ff" stroke-width="1" opacity=".55"/>
<line x1="317" y1="162" x2="351" y2="162" stroke="#4da3ff" stroke-width="1" opacity=".55"/>
<line x1="322" y1="150" x2="346" y2="174" stroke="#4da3ff" stroke-width=".9" opacity=".44"/>
<line x1="346" y1="150" x2="322" y2="174" stroke="#4da3ff" stroke-width=".9" opacity=".44"/>
<circle cx="334" cy="162" r="6" fill="#060e20" stroke="#4da3ff" stroke-width="1"/>
<circle cx="334" cy="162" r="2" fill="#4da3ff" opacity=".65"/>
<path d="M318,148 Q309,162 318,176" fill="none" stroke="#4da3ff" stroke-width="1.5" opacity=".28"/>
<!-- rear wheel -->
<circle cx="130" cy="162" r="24" fill="url(#wh)"/>
<circle cx="130" cy="162" r="18" fill="none" stroke="#18304e" stroke-width="1.2"/>
<line x1="130" y1="145" x2="130" y2="179" stroke="#4da3ff" stroke-width="1" opacity=".55"/>
<line x1="113" y1="162" x2="147" y2="162" stroke="#4da3ff" stroke-width="1" opacity=".55"/>
<line x1="118" y1="150" x2="142" y2="174" stroke="#4da3ff" stroke-width=".9" opacity=".44"/>
<line x1="142" y1="150" x2="118" y2="174" stroke="#4da3ff" stroke-width=".9" opacity=".44"/>
<circle cx="130" cy="162" r="6" fill="#060e20" stroke="#4da3ff" stroke-width="1"/>
<circle cx="130" cy="162" r="2" fill="#4da3ff" opacity=".65"/>
<path d="M114,148 Q105,162 114,176" fill="none" stroke="#4da3ff" stroke-width="1.5" opacity=".28"/>
<!-- sill -->
<rect x="84" y="145" width="268" height="5" rx="1.5" fill="#030810"/>
<path d="M92,149 L356,149" fill="none" stroke="#4da3ff" stroke-width="1.5" opacity=".1" stroke-linecap="round"/>
</svg>
