<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 110" fill="none" role="img" aria-label="Sedan">
  <!-- body -->
  <path d="M12,78 L18,60 L36,44 L62,22 L100,14 L180,14 L210,22 L232,44 L248,62 L252,78 Z" fill="rgba(5,14,32,.88)" stroke="#4da3ff" stroke-width="2" stroke-linejoin="round"/>
  <!-- glass area -->
  <path d="M68,22 L80,12 L180,12 L200,22 L192,42 L70,42 Z" fill="rgba(77,163,255,.09)" stroke="#4da3ff" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- center pillar -->
  <line x1="134" y1="12" x2="130" y2="42" stroke="#4da3ff" stroke-width="1.2" opacity=".5"/>
  <!-- front/rear lines -->
  <line x1="62" y1="22" x2="70" y2="42" stroke="#4da3ff" stroke-width="1" opacity=".4"/>
  <line x1="210" y1="22" x2="192" y2="42" stroke="#4da3ff" stroke-width="1" opacity=".4"/>
  <!-- front wheel -->
  <circle cx="68" cy="78" r="20" fill="rgba(3,9,22,.95)" stroke="#4da3ff" stroke-width="2"/>
  <circle cx="68" cy="78" r="10" fill="none" stroke="#4da3ff" stroke-width="1.3"/>
  <line x1="58" y1="78" x2="78" y2="78" stroke="#4da3ff" stroke-width="1" opacity=".5"/>
  <line x1="68" y1="68" x2="68" y2="88" stroke="#4da3ff" stroke-width="1" opacity=".5"/>
  <circle cx="68" cy="78" r="3" fill="#4da3ff" opacity=".6"/>
  <!-- rear wheel -->
  <circle cx="196" cy="78" r="20" fill="rgba(3,9,22,.95)" stroke="#4da3ff" stroke-width="2"/>
  <circle cx="196" cy="78" r="10" fill="none" stroke="#4da3ff" stroke-width="1.3"/>
  <line x1="186" y1="78" x2="206" y2="78" stroke="#4da3ff" stroke-width="1" opacity=".5"/>
  <line x1="196" y1="68" x2="196" y2="88" stroke="#4da3ff" stroke-width="1" opacity=".5"/>
  <circle cx="196" cy="78" r="3" fill="#4da3ff" opacity=".6"/>
  <!-- headlight -->
  <ellipse cx="249" cy="62" rx="5" ry="8" fill="rgba(77,163,255,.35)" stroke="#4da3ff" stroke-width="1.2"/>
  <!-- taillight -->
  <rect x="12" y="60" width="5" height="14" rx="2" fill="rgba(77,163,255,.25)" stroke="#4da3ff" stroke-width="1"/>
  <!-- ground line -->
  <line x1="30" y1="98" x2="250" y2="98" stroke="#4da3ff" stroke-width="1" opacity=".18"/>
</svg>
