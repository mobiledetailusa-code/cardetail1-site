<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 110" fill="none" role="img" aria-label="RV Motorhome">
  <!-- main RV body — very tall, long -->
  <path d="M8,84 L8,18 L22,8 L60,4 L270,4 L290,12 L302,28 L306,56 L302,84 Z" fill="rgba(5,14,32,.88)" stroke="#4da3ff" stroke-width="2" stroke-linejoin="round"/>
  <!-- cap/front face -->
  <path d="M290,12 L302,28 L306,56 L302,84 L290,84 L282,60 L282,12 Z" fill="rgba(77,163,255,.05)" stroke="#4da3ff" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- windshield -->
  <path d="M282,12 L294,24 L296,50 L280,50 L276,18 Z" fill="rgba(77,163,255,.1)" stroke="#4da3ff" stroke-width="1.3" stroke-linejoin="round"/>
  <!-- cab window -->
  <rect x="240" y="10" width="36" height="30" rx="3" fill="rgba(77,163,255,.08)" stroke="#4da3ff" stroke-width="1.2"/>
  <!-- side windows -->
  <rect x="60" y="14" width="46" height="28" rx="3" fill="rgba(77,163,255,.08)" stroke="#4da3ff" stroke-width="1.2"/>
  <rect x="116" y="14" width="46" height="28" rx="3" fill="rgba(77,163,255,.07)" stroke="#4da3ff" stroke-width="1.2"/>
  <rect x="172" y="14" width="46" height="28" rx="3" fill="rgba(77,163,255,.07)" stroke="#4da3ff" stroke-width="1.2"/>
  <!-- slide-out -->
  <rect x="50" y="50" width="80" height="34" rx="1" fill="rgba(77,163,255,.04)" stroke="#4da3ff" stroke-width="1.2"/>
  <!-- awning -->
  <path d="M60,4 L56,4 L48,24 L140,24 L140,20 L60,20 Z" fill="rgba(77,163,255,.06)" stroke="#4da3ff" stroke-width="1"/>
  <!-- step line -->
  <line x1="22" y1="72" x2="280" y2="72" stroke="#4da3ff" stroke-width="1.2" opacity=".25"/>
  <!-- front wheel -->
  <circle cx="76" cy="84" r="20" fill="rgba(3,9,22,.95)" stroke="#4da3ff" stroke-width="2"/>
  <circle cx="76" cy="84" r="10" fill="none" stroke="#4da3ff" stroke-width="1.3"/>
  <line x1="66" y1="84" x2="86" y2="84" stroke="#4da3ff" stroke-width="1" opacity=".5"/>
  <line x1="76" y1="74" x2="76" y2="94" stroke="#4da3ff" stroke-width="1" opacity=".5"/>
  <circle cx="76" cy="84" r="3" fill="#4da3ff" opacity=".6"/>
  <!-- rear wheel -->
  <circle cx="242" cy="84" r="20" fill="rgba(3,9,22,.95)" stroke="#4da3ff" stroke-width="2"/>
  <circle cx="242" cy="84" r="10" fill="none" stroke="#4da3ff" stroke-width="1.3"/>
  <line x1="232" y1="84" x2="252" y2="84" stroke="#4da3ff" stroke-width="1" opacity=".5"/>
  <line x1="242" y1="74" x2="242" y2="94" stroke="#4da3ff" stroke-width="1" opacity=".5"/>
  <circle cx="242" cy="84" r="3" fill="#4da3ff" opacity=".6"/>
  <!-- headlight -->
  <ellipse cx="302" cy="56" rx="5" ry="10" fill="rgba(77,163,255,.35)" stroke="#4da3ff" stroke-width="1.2"/>
  <!-- taillight -->
  <rect x="7" y="46" width="4" height="22" rx="2" fill="rgba(77,163,255,.25)" stroke="#4da3ff" stroke-width="1"/>
  <!-- ground line -->
  <line x1="22" y1="104" x2="294" y2="104" stroke="#4da3ff" stroke-width="1" opacity=".18"/>
</svg>
