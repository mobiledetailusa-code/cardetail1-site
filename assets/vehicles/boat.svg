<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 110" fill="none" role="img" aria-label="Boat">
  <!-- hull bottom / keel -->
  <path d="M20,78 Q60,90 140,92 Q220,90 264,78 L260,68 Q200,80 140,82 Q80,80 24,68 Z" fill="rgba(5,14,32,.9)" stroke="#4da3ff" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- hull side -->
  <path d="M24,68 Q80,80 140,82 Q200,80 260,68 L258,52 Q200,64 140,66 Q80,64 26,52 Z" fill="rgba(5,14,32,.8)" stroke="#4da3ff" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- gunwale / deck edge -->
  <path d="M26,52 Q80,64 140,66 Q200,64 258,52 L254,42 Q200,52 140,54 Q80,52 30,42 Z" fill="rgba(77,163,255,.05)" stroke="#4da3ff" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- bow (front) curve -->
  <path d="M30,42 Q22,30 28,18 L36,14 Q42,28 42,42 Z" fill="rgba(5,14,32,.7)" stroke="#4da3ff" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- deck/cockpit area -->
  <path d="M42,42 L42,30 L110,26 L110,42 Z" fill="rgba(77,163,255,.06)" stroke="#4da3ff" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- windshield -->
  <path d="M108,26 L108,40 L130,38 L132,24 Z" fill="rgba(77,163,255,.12)" stroke="#4da3ff" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- console/helm -->
  <rect x="130" y="28" width="22" height="18" rx="2" fill="rgba(77,163,255,.08)" stroke="#4da3ff" stroke-width="1.2"/>
  <!-- bimini top (soft roof) -->
  <path d="M128,22 L132,16 L200,16 L204,22" fill="none" stroke="#4da3ff" stroke-width="1.2" opacity=".5"/>
  <line x1="132" y1="16" x2="132" y2="22" stroke="#4da3ff" stroke-width="1" opacity=".4"/>
  <line x1="200" y1="16" x2="200" y2="22" stroke="#4da3ff" stroke-width="1" opacity=".4"/>
  <!-- bow rail -->
  <path d="M28,18 L36,14 L60,12 L60,20" fill="none" stroke="#4da3ff" stroke-width="1" opacity=".4"/>
  <!-- rear seating -->
  <rect x="160" y="34" width="80" height="12" rx="3" fill="rgba(77,163,255,.05)" stroke="#4da3ff" stroke-width="1"/>
  <!-- motor (outboard) suggestion -->
  <rect x="255" y="52" width="10" height="22" rx="2" fill="rgba(77,163,255,.1)" stroke="#4da3ff" stroke-width="1.2"/>
  <line x1="260" y1="74" x2="260" y2="88" stroke="#4da3ff" stroke-width="1.5"/>
  <!-- water line -->
  <line x1="14" y1="88" x2="270" y2="88" stroke="#4da3ff" stroke-width="1" opacity=".2"/>
  <!-- water ripple suggestion -->
  <path d="M30,92 Q60,89 90,92 Q120,95 150,92 Q180,89 210,92" fill="none" stroke="#4da3ff" stroke-width="0.8" opacity=".15"/>
</svg>
