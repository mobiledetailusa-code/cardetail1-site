<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title id="page-title">Recent Work — Cardetail1 Mobile Detailing</title>
<meta name="description" id="page-desc" content="Professional mobile detailing results by Cardetail1 in Bergen County, NJ.">
<meta property="og:type" content="article">
<meta property="og:site_name" content="Cardetail1">
<meta property="og:title" id="og-title" content="Recent Work — Cardetail1">
<meta property="og:description" id="og-desc" content="Professional mobile detailing results by Cardetail1.">
<meta property="og:image" id="og-image" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--bg2:#18181f;--bg3:#1f1f28;--white:#f1f1f3;--mu:rgba(255,255,255,.45);--blue:#4da3ff;--gr:#00c853;--r:12px;--bbr:rgba(255,255,255,.08)}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--white);min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:32px 20px}
.logo{font-size:16px;font-weight:800;letter-spacing:.06em;opacity:.5;margin-bottom:24px;text-align:center}
.logo span{color:var(--blue)}
.card{background:var(--bg2);border:1px solid var(--bbr);border-radius:var(--r);overflow:hidden}
.card-img{width:100%;max-height:480px;object-fit:cover}
.card-body{padding:24px}
.card-title{font-size:22px;font-weight:800;margin-bottom:8px;line-height:1.3}
.card-meta{font-size:13px;color:var(--mu);margin-bottom:16px;line-height:1.7}
.card-meta b{color:var(--white)}
.card-caption{font-size:14px;color:var(--mu);line-height:1.7;margin-bottom:20px;border-left:3px solid var(--blue);padding-left:14px}
.card-ba{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
.card-ba img{width:100%;border-radius:8px;object-fit:cover;max-height:260px}
.card-ba-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--mu);margin-bottom:4px}
.ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.cta{display:inline-flex;align-items:center;gap:6px;padding:12px 22px;border-radius:10px;font-size:13px;font-weight:700;text-decoration:none;transition:.2s;border:none;cursor:pointer}
.cta-p{background:var(--blue);color:#000}.cta-p:hover{background:#3d94f0;transform:translateY(-1px)}
.cta-g{background:transparent;border:1.5px solid var(--bbr);color:var(--white)}.cta-g:hover{background:var(--bg3)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:24px}
.gallery-item{background:var(--bg2);border:1px solid var(--bbr);border-radius:var(--r);overflow:hidden;text-decoration:none;color:inherit;transition:.2s}
.gallery-item:hover{border-color:rgba(77,163,255,.3);transform:translateY(-2px)}
.gallery-item img{width:100%;height:180px;object-fit:cover}
.gallery-item .gi-body{padding:12px}
.gallery-item .gi-title{font-size:13px;font-weight:700;margin-bottom:4px}
.gallery-item .gi-meta{font-size:11px;color:var(--mu)}
.empty{text-align:center;padding:60px 20px;color:var(--mu)}
.empty-icon{font-size:40px;margin-bottom:12px}
@media(max-width:500px){.card-ba{grid-template-columns:1fr}.card-title{font-size:18px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">CAR<span>DETAIL</span>1</div>
  <div id="content">
    <div style="text-align:center;padding:40px;color:var(--mu)">Loading…</div>
  </div>
</div>
<script>
const BACKEND='/.netlify/functions/proof-cards';

function getParam(n){ return new URLSearchParams(location.search).get(n); }

async function init(){
  const slug = getParam('slug') || getParam('s');
  const id = getParam('id');

  if(slug || id){
    await loadSingleCard(slug, id);
  } else {
    await loadGallery();
  }
}

async function loadSingleCard(slug, id){
  try{
    const url = slug ? BACKEND+'?slug='+encodeURIComponent(slug) : BACKEND+'?id='+encodeURIComponent(id);
    const r = await fetch(url);
    const d = await r.json();
    if(!d.ok || !d.card){ showNotFound(); return; }
    renderCard(d.card);
  }catch(_){ showNotFound(); }
}

async function loadGallery(){
  try{
    const r = await fetch(BACKEND+'?list=public');
    const d = await r.json();
    if(!d.ok){ showEmpty(); return; }
    renderGallery(d.cards || []);
  }catch(_){ showEmpty(); }
}

function renderCard(c){
  document.getElementById('page-title').textContent = (c.seoTitle||'Recent Work')+' — Cardetail1';
  document.getElementById('page-desc').content = c.seoDescription||'';
  document.getElementById('og-title').content = c.seoTitle||'Cardetail1 Recent Work';
  document.getElementById('og-desc').content = c.seoDescription||'';
  if(c.photoUrl) document.getElementById('og-image').content = c.photoUrl;

  const vehicle = [c.vehicleYear, c.vehicleMake, c.vehicleModel].filter(Boolean).join(' ');
  let photoHtml = '';
  if(c.beforePhotoUrl && c.afterPhotoUrl){
    photoHtml = '<div class="card-ba"><div><div class="card-ba-label">Before</div><img src="'+esc(c.beforePhotoUrl)+'" alt="Before '+esc(c.seoAltText||'')+'"></div><div><div class="card-ba-label">After</div><img src="'+esc(c.afterPhotoUrl)+'" alt="After '+esc(c.seoAltText||'')+'"></div></div>';
  } else if(c.photoUrl){
    photoHtml = '<img class="card-img" src="'+esc(c.photoUrl)+'" alt="'+esc(c.seoAltText||vehicle)+'">';
  }

  document.getElementById('content').innerHTML = '<div class="card">'
    + photoHtml
    + '<div class="card-body">'
    + '<div class="card-title">'+esc(c.seoTitle || vehicle+' Detail')+'</div>'
    + '<div class="card-meta">'
    + (vehicle ? '<b>'+esc(vehicle)+'</b>' : '')
    + (c.vehicleClass ? ' · '+esc(c.vehicleClass) : '')
    + (c.servicePackage ? ' · '+esc(c.servicePackage) : '')
    + (c.cityArea ? '<br>📍 '+esc(c.cityArea) : '')
    + (c.addons ? '<br>Add-ons: '+esc(c.addons) : '')
    + '</div>'
    + (c.caption ? '<div class="card-caption">'+esc(c.caption)+'</div>' : '')
    + '<div class="ctas">'
    + '<a class="cta cta-p" href="/#booking">Book Similar Service →</a>'
    + '<a class="cta cta-g" href="/#packages">View Packages</a>'
    + '<a class="cta cta-g" href="tel:5513132956">Ask About This Service</a>'
    + '</div>'
    + '</div></div>';
}

function renderGallery(cards){
  if(!cards.length){ showEmpty(); return; }
  let html = '<div style="text-align:center;margin-bottom:24px"><div style="font-size:22px;font-weight:800">Recent Work</div><div style="font-size:13px;color:var(--mu);margin-top:4px">Real completed jobs by Cardetail1 Mobile Detailing</div></div>';
  html += '<div class="gallery">';
  for(const c of cards){
    const vehicle = [c.vehicleYear, c.vehicleMake, c.vehicleModel].filter(Boolean).join(' ');
    const img = c.photoUrl || c.afterPhotoUrl || '';
    const href = '/work.html?slug='+encodeURIComponent(c.slug);
    html += '<a class="gallery-item" href="'+href+'">'
      + (img ? '<img src="'+esc(img)+'" alt="'+esc(c.seoAltText||vehicle)+'">' : '')
      + '<div class="gi-body"><div class="gi-title">'+esc(vehicle || c.vehicleClass || 'Vehicle Detail')+'</div>'
      + '<div class="gi-meta">'+esc(c.servicePackage||'Detail')+' · '+esc(c.cityArea||'NJ')+'</div></div></a>';
  }
  html += '</div>';
  html += '<div style="text-align:center;margin-top:32px"><a class="cta cta-p" href="/#booking">Book Your Detail →</a></div>';
  document.getElementById('content').innerHTML = html;
}

function showNotFound(){
  document.getElementById('content').innerHTML = '<div class="empty"><div class="empty-icon">🔍</div><div>This work page is not available.</div><div style="margin-top:16px"><a class="cta cta-p" href="/">Back to Cardetail1</a></div></div>';
}
function showEmpty(){
  document.getElementById('content').innerHTML = '<div class="empty"><div class="empty-icon">📷</div><div>No published work yet. Check back soon!</div><div style="margin-top:16px"><a class="cta cta-p" href="/">Book a Detail</a></div></div>';
}
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

init();
</script>
</body>
</html>
